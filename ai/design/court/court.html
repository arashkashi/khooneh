lede:["A detailed design for the گودال باغچه, the open pit on the yard side that lights the basement (−1). In iteration 4, −1 becomes a shared space for gatherings, events and possibly a gym. Every number here was measured with the AI's sun tool on copies of iteration 3 with the court changed.","طرح دقیق گودال باغچه، گودال باز سمت حیاط که به زیرزمین (طبقهٔ ۱−) نور می‌دهد. در دور چهارم، طبقهٔ ۱− فضای مشترک برای دورهمی، مراسم و شاید باشگاه ورزشی ساکنان می‌شود. همهٔ عددها با ابزار آفتاب هوش مصنوعی روی نسخه‌هایی از دور سوم با گودال تغییریافته اندازه گرفته شده‌اند."],
notice:["<b>The main case.</b> The owner confirmed the plot: the street side faces 37° east of north, so the court faces south-west, and the rear plot builds on our boundary. Everything is designed for that case; the others are shown for comparison. This is a study: it changes no plan data, and iteration 4 decides what to adopt.","<b>حالت اصلی.</b> صاحب‌کار زمین را تأیید کرد: سمت خیابان ۳۷ درجه از شمال به سوی شرق است، پس گودال رو به جنوب‌غرب است، و زمین پشتی روی مرز ما می‌سازد. همه‌چیز برای این حالت طراحی شده؛ حالت‌های دیگر فقط برای مقایسه‌اند. این یک بررسی است: دادهٔ نقشه را تغییر نمی‌دهد و دور چهارم تصمیم می‌گیرد چه چیزی را بپذیرد."],

rec:["<p>Keep the court at its <b>full depth: 5.5 m clear from the glass to the rear wall, 7.55 m wide, floor at −3.12</b>, on natural ground.</p><ul><li><b>Stair:</b> a dog-leg stair in a 2.45 m strip on the east side comes down from the bridge and lands beside the doors.</li><li><b>Glass and doors:</b> the whole court side of −1 is glass. A pair of hinged glass doors, 2 × 0.8 m and opening out, stands under the bridge on the line from the lift. The floor runs out level.</li><li><b>Tree, the owner's choice:</b> a silver birch (توس). We advise its upright form, <i>Betula pendula</i> 'Fastigiata': white trunk, straight up, 8–12 m tall and only 2.5–4 m wide, so it fits between the balconies and the rear wall. It is a sun tree in a shaded court, so it gets steady drip water from stored rain. Columnar hornbeam and Persian ironwood stay as alternatives. No poplar, no walnut.</li><li><b>Water:</b> a raised stone basin outside the glass instead of a hoz through it.</li></ul><p><b>Honestly:</b> with the rear building on our boundary, the floor gets <b>no sun in December and about 1.3 hours on 21 June</b>, and the glass sees about <b>1.5% of the sky</b>, whatever shape the court takes. So it is designed as a cool, green, shaded outdoor room and a view, as the old sunken courts were in summer. Light-coloured walls matter more than the court's shape. −1 will need electric light for most activities.</p>",
"<p>گودال را با <b>عمق کامل نگه دارید: ۵٫۵ متر خالص از شیشه تا دیوار پشتی، ۷٫۵۵ متر پهنا، کف در ۳٫۱۲−</b>، روی زمین طبیعی.</p><ul><li><b>پله:</b> پله‌ای دوبازو در نواری ۲٫۴۵ متری در سمت شرق، از پل پایین می‌آید و کنار درها فرود می‌آید.</li><li><b>شیشه و درها:</b> تمام سمت گودالِ طبقهٔ ۱− شیشه است. یک جفت در شیشه‌ای لولایی، ۲ × ۰٫۸ متر و رو به بیرون، زیر پل و روی خط دید از آسانسور است. کف هم‌تراز بیرون می‌رود.</li><li><b>درخت، انتخاب صاحب‌کار:</b> توس. فرم ستونی آن را پیشنهاد می‌کنیم، <i>Betula pendula</i> 'Fastigiata': تنهٔ سفید، راست به بالا، ۸ تا ۱۲ متر بلند و فقط ۲٫۵ تا ۴ متر پهن، پس میان بالکن‌ها و دیوار پشتی جا می‌شود. درخت آفتاب است در گودالی سایه‌دار، پس با آب باران ذخیره‌شده آبیاری قطره‌ای پیوسته می‌گیرد. ممرز ستونی و انجیلی جایگزین می‌مانند. صنوبر نه، گردو نه.</li><li><b>آب:</b> حوضی سنگی و برجسته بیرون شیشه، به جای حوضی که از شیشه بگذرد.</li></ul><p><b>صادقانه:</b> با ساختمان پشتی روی مرز ما، کف گودال <b>در آذر هیچ آفتابی نمی‌گیرد و در ۳۱ خرداد حدود ۱٫۳ ساعت</b>، و شیشه حدود <b>۱٫۵٪ آسمان</b> را می‌بیند، شکل گودال هر چه باشد. پس گودال اتاقی بیرونی، خنک، سبز و سایه‌دار و یک چشم‌انداز طراحی شده است، همان‌طور که گودال باغچه‌های قدیم در تابستان بودند. رنگ روشن دیوارها از شکل گودال مهم‌تر است. طبقهٔ ۱− برای بیشتر کارها نور برق می‌خواهد.</p>"],

thVar:["Variant","گزینه"],thSize:["Court clear, m","گودال خالص، متر"],thFloorA:["Floor, m²","کف، m²"],thFloor:["Floor sun, h, Dec / Mar / Jun","آفتاب کف، ساعت، آذر / فروردین / خرداد"],thCrown6:["Crown at 6 m, h, Dec / Jun","تاج در ۶ متر، ساعت، آذر / خرداد"],thBeds:["Beds, h, Jun","باغچه، ساعت، خرداد"],thSky:["Glass sky","آسمانِ شیشه"],thAdf:["Daylight factor, rough","ضریب نور روز، تقریبی"],thGsun:["Glass sun, h, Jun / Aug","آفتاب شیشه، ساعت، خرداد / مرداد"],
varSays:["<ul><li><b>Shape barely matters in the main case.</b> Every variant gets 0.7 h in March and 1.3–1.4 h in June on the floor. The rear building decides it.</li><li><b>4.5 m against 5.5 m:</b> the same sun, but 7.5 m² less floor, and in B the tree stands at the balconies' edge. 4.5 m is enough for light and for the rule, not for a tree and a table.</li><li><b>Seat steps (D):</b> the top step's planting gains a tenth of an hour and the floor loses a third. Rejected.</li><li><b>The tree's place</b> hardly matters: across the open middle of C the best and worst spots differ by 1.4 hours, summed over four days and two crown heights. So it stands where it reads best from the lift.</li></ul>","<ul><li><b>در حالت اصلی شکل گودال تقریباً بی‌اثر است.</b> همهٔ گزینه‌ها روی کف در فروردین ۰٫۷ و در خرداد ۱٫۳ تا ۱٫۴ ساعت آفتاب می‌گیرند. ساختمان پشتی تعیین‌کننده است.</li><li><b>۴٫۵ در برابر ۵٫۵ متر:</b> همان آفتاب، اما ۷٫۵ متر مربع کف کمتر، و در B درخت لب بالکن‌ها می‌ایستد. ۴٫۵ متر برای نور و ضابطه کافی است، نه برای درخت و یک میز.</li><li><b>پله‌های نشستن (D):</b> کاشت پلهٔ بالا یک‌دهم ساعت بیشتر می‌گیرد و کف یک‌سوم کوچک می‌شود. رد شد.</li><li><b>جای درخت</b> تقریباً بی‌اهمیت است: در میانهٔ باز C بهترین و بدترین نقطه، جمعاً در چهار روز و دو ارتفاع تاج، ۱٫۴ ساعت فرق دارند. پس درخت جایی می‌ایستد که از آسانسور بهتر دیده شود.</li></ul>"],

birchIntro:["<p>The owner chose a <b>silver birch</b> (توس, <i>Betula pendula</i>): tall, fast, straight up, with a white trunk. Its profile, from the sources below the table:</p>","<p>صاحب‌کار <b>توس</b> (<i>Betula pendula</i>) را برگزید: بلند، تندرشد، راست به بالا، با تنهٔ سفید. مشخصاتش، از منابع زیر جدول:</p>"],
birchForm:["<p><b>Which form: we advise the upright 'Fastigiata'.</b> The plain species grows 15–25 m and 6–8 m wide. Standing 1.7 m from the balconies' edge and 2.2 m from the rear wall, its crown would press on our balconies and the rear building within 15 years, and a birch takes hard pruning badly. The upright form stays 2.5–4 m wide, keeps the white trunk, and fits.</p><p><b>The trade-off, plainly:</b> the upright form tops out at 8–12 m above its ground, so its crown never reaches the court's sunny zone at about 15 m. It will live its whole life with 2.5–4.3 hours of June sun. Birch is a light-demanding pioneer, so expect a thinner crown and slower growth than in the open, and perhaps a shorter life. Steady water matters more than anything else. If it struggles in its first three to five years, replace it with a columnar hornbeam or Persian ironwood <span class='tag j'>judgement</span>.</p><p><b>NHBC:</b> birch is low water demand in a general list; NHBC's own table was not read, and unlisted broadleaves count as moderate. On that basis its zone is about 4–6 m (low) or 6–9 m (moderate), against our 3.5 m to the basement: much gentler than a poplar's 25–38 m.</p>","<p><b>کدام فرم: فرم ستونی 'Fastigiata' را پیشنهاد می‌کنیم.</b> گونهٔ معمولی ۱۵ تا ۲۵ متر بلند و ۶ تا ۸ متر پهن می‌شود. در فاصلهٔ ۱٫۷ متری لبهٔ بالکن‌ها و ۲٫۲ متری دیوار پشتی، تاجش ظرف ۱۵ سال به بالکن‌های ما و ساختمان پشتی فشار می‌آورد، و توس هرس سنگین را خوب تاب نمی‌آورد. فرم ستونی ۲٫۵ تا ۴ متر پهن می‌ماند، تنهٔ سفید را دارد و جا می‌شود.</p><p><b>بده‌بستان، صریح:</b> فرم ستونی در ۸ تا ۱۲ متر بالای زمینش می‌ایستد، پس تاجش هرگز به بخش آفتابی گودال در حدود ۱۵ متر نمی‌رسد. همهٔ عمر با ۲٫۵ تا ۴٫۳ ساعت آفتاب خرداد زندگی می‌کند. توس پیشاهنگی نورخواه است، پس تاجی کم‌پشت‌تر و رشدی کندتر از زمین باز و شاید عمری کوتاه‌تر انتظار بکشید. آب پیوسته از همه مهم‌تر است. اگر در سه تا پنج سال اول نگرفت، با ممرز ستونی یا انجیلی عوضش کنید <span class='tag j'>قضاوت</span>.</p><p><b>NHBC:</b> توس در یک فهرست عمومی کم‌آب‌خواه است؛ جدول خود NHBC خوانده نشد و پهن‌برگ‌های فهرست‌نشده متوسط شمرده می‌شوند. بر این پایه حوزه‌اش حدود ۴ تا ۶ متر (کم) یا ۶ تا ۹ متر (متوسط) است، در برابر ۳٫۵ متر ما تا زیرزمین: بسیار ملایم‌تر از ۲۵ تا ۳۸ متر صنوبر.</p>"],
hBirchSun:["Sun on a birch crown, and the years to get there","آفتاب روی تاج توس، و سال‌هایی که تا آنجا طول می‌کشد"],
subBirchSun:["Hours of sun at the tree's place, with the chosen neighbours. Years are after planting a 4–5 m tree: a judgement from the sources' growth rates, slowed for the shade. A dash means the form never gets that tall.","ساعت آفتاب در جای درخت، با حالت همسایهٔ انتخاب‌شده. سال‌ها پس از کاشت درختی ۴ تا ۵ متری است: قضاوتی بر پایهٔ سرعت رشد در منابع، کندتر برای سایه. خط تیره یعنی این فرم هرگز به آن بلندی نمی‌رسد."],

hBirchCare:["Pit, soil, root barrier and water for the birch","چاله، خاک، مانع ریشه و آب برای توس"],
birchCare:["<ul><li><b>Pit:</b> unchanged, 2.8 × 2.8 m at x 4.1–6.9, y 16.1–18.9, 1.2 m deep. Birch roots are shallow and wide, so the soil cells under the paving (to about 33 m³ in all) matter more than depth. Use moisture-holding loam with organic matter, since Qazvin's soils are alkaline and birch prefers neutral to acid, with 75 mm of bark mulch kept off the trunk.</li><li><b>Root barrier:</b> unchanged, 1.2 m deep on the basement, −2, stair and rear walls. Birch roots are not aggressive, but they find leaks.</li><li><b>Water:</b> drip from stored rainwater. In summer the upright birch takes about {tl} L a day and the beds about {bl} L: about <b>{sm} m³</b> from May to September. A rain tank of about <b>{tk} m³</b> in the −2 plant room, filled from the roof downpipes through a first-flush filter, carries winter rain to summer. Our roof sheds about {rh} m³ a year, and the court sump can top it up in spring. Mains water is the backup. The plain species would need about {sm2} m³.</li><li><b>Beds under it:</b> a birch dries the soil under its crown, so the shade plants need their own drip line.</li></ul>","<ul><li><b>چاله:</b> بدون تغییر، ۲٫۸ × ۲٫۸ متر در x ۴٫۱ تا ۶٫۹، y ۱۶٫۱ تا ۱۸٫۹، به عمق ۱٫۲ متر. ریشهٔ توس سطحی و گسترده است، پس سلول‌های خاک زیر سنگ‌فرش (تا حدود ۳۳ متر مکعب در کل) از عمق مهم‌ترند. خاک لومی نگه‌دارندهٔ رطوبت با مادهٔ آلی، چون خاک قزوین قلیایی است و توس خاک خنثی تا اسیدی را می‌پسندد، با ۷۵ میلی‌متر مالچ پوست درخت دور از تنه.</li><li><b>مانع ریشه:</b> بدون تغییر، به عمق ۱٫۲ متر کنار دیوارهای زیرزمین، ۲−، پله و پشتی. ریشهٔ توس مهاجم نیست، اما نشتی‌ها را پیدا می‌کند.</li><li><b>آب:</b> قطره‌ای از آب باران ذخیره‌شده. در تابستان توس ستونی روزی حدود {tl} لیتر و باغچه‌ها حدود {bl} لیتر می‌گیرند: حدود <b>{sm} متر مکعب</b> از اردیبهشت تا شهریور. مخزن بارانی حدود <b>{tk} متر مکعب</b> در موتورخانهٔ ۲−، پرشده از ناودان‌های بام با فیلتر آب اول، باران زمستان را به تابستان می‌رساند. بام ما سالانه حدود {rh} متر مکعب آب می‌دهد و چاهک گودال در بهار می‌تواند آن را پر کند. آب شهر پشتیبان است. گونهٔ معمولی حدود {sm2} متر مکعب می‌خواست.</li><li><b>باغچه‌های زیرش:</b> توس خاک زیر تاجش را خشک می‌کند، پس گیاهان سایه‌پسند لولهٔ قطره‌ای خود را می‌خواهند.</li></ul>"],

hTree:["Other trees: poplars, walnut and the alternatives","درختان دیگر: صنوبرها، گردو و جایگزین‌ها"],
treeIntro:["<p>The owner first named four poplars, then chose the silver birch above. What the court asks of a tree:</p><ul><li><b>Tall and narrow:</b> its crown is in real sun only above about 15 m over the floor, in a slot 6.1 m wide.</li><li><b>Shade-tolerant when young:</b> it spends 20–30 years below that, with 2–4 hours of summer sun.</li><li><b>Gentle roots:</b> the trunk is 3.5 m from our basement wall and about 2.6 m from the rear neighbour's building, with drains, sump and waterproofing in reach.</li><li><b>Lives on stored water</b> in a dry city.</li></ul><p><b>Distance from buildings.</b> UK building guidance (NHBC Standards 4.2) rates oaks, poplars, willows, elms, eucalyptus and hawthorn as <b>high</b> water demand; most other broadleaves default to moderate. A tree's zone of influence is 1.25 × its mature height for high demand and 0.75 × for moderate. The zone is where foundations on clay must go deeper, not a safe distance; compare it with our 3.5 m to the basement and about 2.6 m to the rear building. It is written for clay; Qazvin's soil here is unknown, and our basement footings are deep. The real risks are roots in drains and at the waterproofing, and the neighbours' shallower footings.</p>","<p>صاحب‌کار اول چهار صنوبر نام برد و سپس توسِ بالا را برگزید. آنچه گودال از درخت می‌خواهد:</p><ul><li><b>بلند و باریک:</b> تاجش فقط بالاتر از حدود ۱۵ متر بالای کف، در شکافی ۶٫۱ متری، آفتاب واقعی می‌گیرد.</li><li><b>سایه‌پسند در جوانی:</b> ۲۰ تا ۳۰ سال پایین‌تر از آن، با ۲ تا ۴ ساعت آفتاب تابستان، می‌گذراند.</li><li><b>ریشهٔ ملایم:</b> تنه ۳٫۵ متر از دیوار زیرزمین ما و حدود ۲٫۶ متر از ساختمان همسایهٔ پشتی است و آبرو، چاهک و عایق در دسترس ریشه‌اند.</li><li><b>با آب ذخیره زنده بماند</b> در شهری خشک.</li></ul><p><b>فاصله از ساختمان.</b> راهنمای ساختمانی بریتانیا (NHBC، بخش ۴٫۲) بلوط، صنوبر، بید، نارون، اکالیپتوس و زالزالک را <b>پرآب‌خواه</b> می‌شمارد؛ بیشتر پهن‌برگ‌های دیگر به‌طور پیش‌فرض متوسط‌اند. حوزهٔ اثر درخت ۱٫۲۵ برابر ارتفاع بلوغ برای پرآب‌خواه و ۰٫۷۵ برابر برای متوسط است. این حوزه جایی است که پی روی خاک رسی باید عمیق‌تر شود، نه فاصلهٔ ایمن؛ آن را با ۳٫۵ متر ما تا زیرزمین و حدود ۲٫۶ متر تا ساختمان پشتی بسنجید. این برای خاک رسی نوشته شده؛ خاک این زمین در قزوین معلوم نیست و پی زیرزمین ما عمیق است. خطر واقعی ریشه در آبروها و کنار عایق، و پی کم‌عمق‌تر همسایه‌هاست.</p>"],

treeAfter:["<p><b>If a poplar is wanted anyway,</b> only Lombardy poplar (تبریزی) has the shape. Try it only if all of these hold:</p><ul><li>it stands in natural ground beyond the basement's edge, and −2 never goes under the court;</li><li>a root barrier 1.5–2 m deep lines the pit, and every drain within 10 m is sealed welded plastic;</li><li>our basement and −2 walls get a root-resistant membrane;</li><li>the rear and west neighbours agree in writing;</li><li>it is the male clone (no fluff), on drip water;</li><li>it is replaced every 15–20 years, before canker makes a 25 m tree between two buildings a danger.</li></ul><p>Even then a young poplar is a sun tree; in this slot it would grow thin and lean to the light, and canker attacks stressed trees first. <b>Our advice: no poplar here.</b> Qazvin's poplar rows grow in open, sunny, irrigated land, the opposite of this pit.</p><p><b>Alternatives to the birch.</b> If the birch struggles in its first three to five years, or someone in the building is allergic to birch pollen: 1. <b>Columnar hornbeam</b> (ممرز, 'Frans Fontaine'), the most shade-tolerant big tree, native to Iran's northern forests (but its pollen cross-reacts with birch allergy). 2. <b>Persian ironwood</b> (انجیلی), a medium tree, lowest risk. A male columnar ginkgo is a slower third. <b>Walnut</b> (گردو) is not proposed: it needs full sun, spreads wider than the court, and its juglone holds back the beds.</p><p class='small'>Sourced: the NHBC groups and zones; white poplar's suckering; Lombardy poplar's canker; ginkgo; hackberry; Persian ironwood. General knowledge, to check with a Qazvin nursery: hornbeam's shade tolerance and size, aspen's groves, mulberry pollen, ash and plane sizes, Lombardy poplar as a male clone.</p>","<p><b>اگر باز هم صنوبر خواسته شود،</b> فقط تبریزی شکل مناسب دارد. فقط وقتی امتحانش کنید که همهٔ این‌ها برقرار باشد:</p><ul><li>در زمین طبیعی بیرون از لبهٔ زیرزمین باشد و طبقهٔ ۲− هرگز زیر گودال نرود؛</li><li>دور چاله مانع ریشه به عمق ۱٫۵ تا ۲ متر باشد و همهٔ آبروها تا ۱۰ متر لولهٔ پلاستیکی جوشی و آب‌بند باشند؛</li><li>دیوارهای زیرزمین و طبقهٔ ۲− عایق مقاوم به ریشه بگیرند؛</li><li>همسایه‌های پشتی و غربی کتبی موافقت کنند؛</li><li>کلون نر باشد (بی‌پنبه)، با آبیاری قطره‌ای؛</li><li>هر ۱۵ تا ۲۰ سال عوض شود، پیش از آنکه شانکر درختی ۲۵ متری میان دو ساختمان را خطرناک کند.</li></ul><p>حتی آن‌وقت هم صنوبر جوان درخت آفتاب است؛ در این شکاف لاغر و کج به سوی نور رشد می‌کند و شانکر اول به درخت تحت فشار حمله می‌کند. <b>توصیهٔ ما: اینجا صنوبر نکارید.</b> ردیف‌های صنوبر قزوین در زمین باز، آفتابی و آبی می‌رویند، برعکس این گودال.</p><p><b>جایگزین‌های توس.</b> اگر توس در سه تا پنج سال اول نگیرد، یا کسی در ساختمان به گردهٔ توس حساسیت داشته باشد: ۱. <b>ممرز ستونی</b> ('Frans Fontaine')، سایه‌پسندترین درخت بزرگ، بومی جنگل‌های شمال ایران (اما گرده‌اش با حساسیت توس واکنش متقابل دارد). ۲. <b>انجیلی</b>، درختی متوسط و کم‌خطرترین. جینکوی نر ستونی سومی کندتر است. <b>گردو</b> پیشنهاد نمی‌شود: آفتاب کامل می‌خواهد، از گودال پهن‌تر می‌شود و جوگلونش باغچه‌ها را عقب نگه می‌دارد.</p><p class='small'>با منبع: گروه‌ها و حوزه‌های NHBC؛ پاجوش سپیدار؛ شانکر تبریزی؛ جینکو؛ داغداغان؛ انجیلی. دانستهٔ عمومی که باید با نهالستانی در قزوین سنجیده شود: سایه‌پسندی و اندازهٔ ممرز، بیشه‌های صنوبر لرزان، گردهٔ توت، اندازهٔ زبان‌گنجشک و چنار، و کلون نر بودن تبریزی.</p>"],
hLight:["Daylight in −1, and summer shading","نور روز در ۱−، و سایه در تابستان"],
lightText:["<p>“Sky” is the vertical sky component of the glass: how much of an overcast sky it sees. 27% is good daylight for a home; under 5% is dim. The daylight factor is a rough average for a room 4.6 m deep behind the glass, by the usual formula: 2% is a well-lit room, under 1% needs electric light most of the day. The no-sky line is how far in a desk still sees some sky.</p>","<p>«آسمان» مؤلفهٔ آسمانِ عمودیِ شیشه است: چه مقدار از آسمان ابری را می‌بیند. ۲۷٪ برای خانه نور خوب است؛ کمتر از ۵٪ کم‌نور. ضریب نور روز میانگینی تقریبی برای اتاقی به عمق ۴٫۶ متر پشت شیشه است، با فرمول معمول: ۲٪ اتاق خوش‌نور است و کمتر از ۱٪ بیشتر روز نور برق می‌خواهد. خط بی‌آسمان فاصله‌ای است که میز تا آنجا هنوز کمی آسمان می‌بیند.</p>"],
thChange:["Variant or change","گزینه یا تغییر"],thNosky:["No-sky line, m","خط بی‌آسمان، متر"],
lightAfter:["<ul><li><b>Balconies and bridge stay.</b> Removing all balconies over the court lifts the glass sky in the main case only from 1.5% to 2.2%, and they give the court its only covered strip.</li><li><b>Reflected light</b> <span class='tag j'>judgement, not measured</span>: the tool counts only direct sky. Here the glass sees mostly walls, so their colour matters more than their shape. Usual practice takes an ordinary wall as about a tenth as bright as the sky behind it, a light wall perhaps twice that; on that basis reflected light could add about 4% with ordinary walls and up to about 8% with light ones, several times the direct sky. So: light lime plaster or pale stone on our retaining walls, pale paving, white undersides on the balconies and bridge. The rear wall above ground is the neighbour's; we can only ask.</li><li><b>Summer shading:</b> in the main case the glass gets 0.8 h of sun on 21 June and 0.2 h on 21 August, so it needs none. If the rear plot stays empty it gets 4.2–4.4 h; the balconies and the tree's leaves shade it then.</li><li><b>Glass:</b> floor to 2.5 m, 17.6 m², double, low-e, toughened or laminated for a gym. The head could rise to the slab (−0.30) for a little more sky.</li></ul>","<ul><li><b>بالکن‌ها و پل بمانند.</b> برداشتن همهٔ بالکن‌های روی گودال آسمانِ شیشه را در حالت اصلی فقط از ۱٫۵٪ به ۲٫۲٪ می‌رساند و آن‌ها تنها نوار سرپوشیدهٔ گودال را می‌دهند.</li><li><b>نور بازتابی</b> <span class='tag j'>قضاوت، اندازه‌گیری نشده</span>: ابزار فقط آسمان مستقیم را می‌شمارد. اینجا شیشه بیشتر دیوار می‌بیند، پس رنگ دیوارها از شکلشان مهم‌تر است. در عمل معمول، دیوار معمولی حدود یک‌دهم آسمانِ پشتش روشن است و دیوار روشن شاید دو برابر آن؛ بر این پایه نور بازتابی با دیوار معمولی حدود ۴٪ و با دیوار روشن تا حدود ۸٪ می‌افزاید، چند برابر آسمان مستقیم. پس: اندود آهک روشن یا سنگ روشن روی دیوارهای حائل ما، سنگ‌فرش روشن، و زیر سفید برای بالکن‌ها و پل. دیوار پشتی بالای زمین مال همسایه است؛ فقط می‌توانیم خواهش کنیم.</li><li><b>سایه در تابستان:</b> در حالت اصلی شیشه در ۳۱ خرداد ۰٫۸ و در ۳۰ مرداد ۰٫۲ ساعت آفتاب می‌گیرد، پس سایبان نمی‌خواهد. اگر زمین پشتی خالی بماند ۴٫۲ تا ۴٫۴ ساعت می‌گیرد؛ آن‌وقت بالکن‌ها و برگ درخت سایه می‌اندازند.</li><li><b>شیشه:</b> از کف تا ۲٫۵ متر، ۱۷٫۶ متر مربع، دوجداره، کم‌گسیل، سکوریت یا لمینیت برای باشگاه. بالای شیشه را می‌شود تا زیر سقف (۰٫۳۰−) برد تا کمی آسمان بیشتر ببیند.</li></ul>"],
hStair:["The stair down from the bridge","پلهٔ پایین‌رو از پل"],
stairText:["<p>A straight flight needs {run} m of run for {rise} m. From the bridge it can only run away from the building and land at the rear wall, as iteration 3 drew it. A dog-leg turns it back.</p><ul><li><b>Steps:</b> {n} risers of {r} mm, goings {g} mm; 2R+G {rg} mm, pitch {p}°, a comfortable stair.</li><li><b>Upper flight:</b> 9 risers, {f} × {w} m, from the top landing at ground level (under the first-floor balcony) away from the building.</li><li><b>Half landing</b> at −1.56, 1.3 m deep. <b>Lower flight:</b> 9 risers back towards the building.</li><li><b>Bottom landing:</b> 1.2 × 1.2 m at court level, right beside the doors.</li><li><b>Guards:</b> 1.1 m along the bridge's open edges, at the half landing and on the lower flight's court side, on a 0.15 m kerb, bars no more than 0.1 m apart. A solid wall between the flights. Handrails both sides at 0.9 m.</li><li><b>Store</b> under the upper flight, about {st} m²: garden tools, chairs for events, the sump's hatch.</li><li><b>As an exit:</b> treat it as −1's second way out: at least 1.1 m clear between handrails; the court doors open from inside without a key (a lever or escape hardware) and lock with a key from outside, never left unlocked, since the stair joins the street walkway; low step lights on an emergency circuit.</li><li><b>Ice:</b> no winter sun, so ice stays. Rough stone treads, grooved nosings, rails on both sides, grit and never salt. Option: a light glass roof over the flights at about +2.4.</li></ul>","<p>پلهٔ یک‌طرفه برای {rise} متر ارتفاع {run} متر طول می‌خواهد. از پل فقط می‌تواند از ساختمان دور شود و کنار دیوار پشتی فرود آید، همان‌طور که دور سوم کشید. پلهٔ دوبازو آن را برمی‌گرداند.</p><ul><li><b>پله‌ها:</b> {n} پله با ارتفاع {r} میلی‌متر، کف {g} میلی‌متر؛ ۲R+G برابر {rg} میلی‌متر، شیب {p} درجه، پله‌ای راحت.</li><li><b>بازوی بالا:</b> ۹ پله، {f} × {w} متر، از پاگرد بالا در تراز همکف (زیر بالکن طبقهٔ اول) رو به دور از ساختمان.</li><li><b>پاگرد میانی</b> در ۱٫۵۶−، به عمق ۱٫۳ متر. <b>بازوی پایین:</b> ۹ پله رو به ساختمان.</li><li><b>پاگرد پایین:</b> ۱٫۲ × ۱٫۲ متر در تراز گودال، درست کنار درها.</li><li><b>جان‌پناه:</b> ۱٫۱ متر در لبه‌های باز پل، در پاگرد میانی و در سمت گودالِ بازوی پایین، روی لبه‌ای ۰٫۱۵ متری، با میله‌هایی با فاصلهٔ حداکثر ۰٫۱ متر. دیواری پر میان دو بازو. دستگیره در دو طرف در ارتفاع ۰٫۹ متر.</li><li><b>انبار</b> زیر بازوی بالا، حدود {st} متر مربع: ابزار باغبانی، صندلی مراسم، دریچهٔ چاهک.</li><li><b>به‌عنوان خروج:</b> آن را راه دوم خروج طبقهٔ ۱− بدانید: دست‌کم ۱٫۱ متر خالص میان دستگیره‌ها؛ درهای گودال از درون بی‌کلید باز شوند (دستگیرهٔ اهرمی یا یراق خروج اضطراری) و از بیرون با کلید قفل شوند و هرگز باز رها نشوند، چون پله به راه پیادهٔ خیابان می‌رسد؛ چراغ‌های کوتاه پله روی مدار اضطراری.</li><li><b>یخ:</b> آفتاب زمستان نمی‌رسد، پس یخ می‌ماند. کف سنگی زبر، دماغهٔ شیاردار، دستگیره در دو طرف، شن و هرگز نمک. گزینه: سقفی سبک از شیشه بالای بازوها در حدود ۲٫۴+.</li></ul>"],
hWater:["Water and drainage","آب و زهکشی"],
waterText:["<p><b>Volumes</b>, on assumptions to confirm: a heavy hour of {mmh} mm, a wet day of {day} mm, a snowfall of {snow} cm. The pit's opening is {op} m²; with a quarter more for rain blown off the walls, {cat} m² drains into it.</p><ul><li>A heavy hour: <b>{sh} m³</b> ({ls} L/s). A wet day: {dm} m³. The snow melting: about {sw} m³.</li><li><b>With the pumps off</b> (S3: safety never depends on a machine), C stores about <b>{stor} m³</b> in the tree pit's hollow, the soil's air spaces and the gravel under the paving: more than a heavy hour and a wet day. Wet soil holds less, so this is the fallback, not the main drain.</li><li><b>Main drain:</b> a slot drain across the door opening, two gullies by the tree pit, a sump of about 1 m³ under the store, two pumps of about {pump} L/s (duty and standby), a high-water alarm, a non-return valve and a stop valve.</li><li><b>Backflow:</b> the court is below the sewer. The pumped pipe loops above street level before it falls to the sewer. Never join the court to the sewer by gravity.</li><li><b>Keep other water out:</b> no balcony, roof or bridge drain into the pit; a 0.15 m kerb at its open edges. A soakaway (چاه جذبی) only if the soil report allows it.</li><li><b>The level threshold</b> is safe because the doors stand under the bridge and balcony, the paving falls away, a slot drain catches splashes, and the open paving sits 50–80 mm below the floor. Drop seals on the leaves.</li><li><b>Winter:</b> the court collects cold air on clear nights, so frost-resistant stone, irrigation and tap drained from inside, a frost-free tap, pumps 3 m down out of the frost. No street snow into the court; court snow onto the beds.</li></ul>","<p><b>حجم‌ها</b>، بر پایهٔ فرض‌هایی که باید تأیید شوند: یک ساعت پرباران {mmh} میلی‌متر، یک روز پرباران {day} میلی‌متر، برف {snow} سانتی‌متر. دهانهٔ گودال {op} متر مربع است؛ با یک‌چهارم بیشتر برای بارانی که باد از دیوارها می‌آورد، {cat} متر مربع به آن می‌ریزد.</p><ul><li>یک ساعت پرباران: <b>{sh} متر مکعب</b> ({ls} لیتر بر ثانیه). یک روز پرباران: {dm} متر مکعب. آب شدن برف: حدود {sw} متر مکعب.</li><li><b>با پمپ خاموش</b> (S3: ایمنی هرگز به دستگاه وابسته نیست)، C حدود <b>{stor} متر مکعب</b> در گودی چالهٔ درخت، منافذ خاک و شن زیر سنگ‌فرش نگه می‌دارد: بیش از یک ساعت پرباران و یک روز پرباران. خاک خیس کمتر نگه می‌دارد، پس این پشتیبان است، نه زهکش اصلی.</li><li><b>زهکش اصلی:</b> آبروی شکافی سراسر دهانهٔ در، دو کف‌شوی کنار چالهٔ درخت، چاهکی حدود ۱ متر مکعب زیر انبار، دو پمپ حدود {pump} لیتر بر ثانیه (یکی کار و یکی ذخیره)، هشدار آب بالا، شیر یک‌طرفه و شیر قطع.</li><li><b>برگشت آب:</b> گودال پایین‌تر از فاضلاب است. لولهٔ پمپ پیش از رسیدن به فاضلاب از تراز خیابان بالاتر حلقه می‌زند. هرگز گودال را با شیب طبیعی به فاضلاب وصل نکنید.</li><li><b>آب‌های دیگر بیرون بمانند:</b> هیچ آبروی بالکن، بام یا پل به گودال نریزد؛ لبه‌ای ۰٫۱۵ متری دور لبه‌های باز. چاه جذبی فقط اگر گزارش خاک اجازه دهد.</li><li><b>آستانهٔ هم‌تراز</b> ایمن است چون درها زیر پل و بالکن‌اند، سنگ‌فرش رو به بیرون شیب دارد، آبروی شکافی ترشح را می‌گیرد و سنگ‌فرش باز ۵۰ تا ۸۰ میلی‌متر پایین‌تر از کف است. نوار آب‌بند پایین لنگه‌ها.</li><li><b>زمستان:</b> گودال در شب‌های صاف هوای سرد را جمع می‌کند، پس سنگ مقاوم به یخ‌زدگی، آبیاری و شیر بیرونی که از داخل تخلیه شوند، شیر ضدیخ، و پمپ‌ها ۳ متر پایین دور از یخ. برف کوچه به گودال ریخته نشود؛ برف گودال روی باغچه‌ها.</li></ul>"],
hoz:["<h3>The hoz</h3><p><b>No hoz half in and half out.</b> The glass would stand in water, a path for leaks and a cold bridge, and the outdoor half would freeze in a court that collects frost, pushing on the glass and its sill. Instead: <b>a raised stone basin outside the glass</b>, 2.4 × 1.0 m, rim 0.45 m (a seat), 0.3 m of water, about 0.7 m³ against about 3 m³ for a sitting pool. From inside you see the water just beyond the glass. It is filled by hand or a small recirculating pump, overflows to the tree pit, and is emptied from آذر to اسفند, when a timber lid makes it a bench. No pool inside −1, so its floor stays open for events and the gym.</p>","<h3>حوض</h3><p><b>حوضِ نیمی درون و نیمی بیرون نه.</b> شیشه در آب می‌ایستد، راهی برای نشت و پل سرمایی، و نیمهٔ بیرونی در گودالی که سرما را جمع می‌کند یخ می‌زند و به شیشه و زیرش فشار می‌آورد. به جایش: <b>حوضی سنگی و برجسته بیرون شیشه</b>، ۲٫۴ × ۱٫۰ متر، لبه ۰٫۴۵ متر (یک نشیمن)، ۰٫۳ متر آب، حدود ۰٫۷ متر مکعب در برابر حدود ۳ متر مکعب برای حوض نشستن. از درون آب را درست پشت شیشه می‌بینید. با دست یا پمپ کوچک گردشی پر می‌شود، سرریزش به چالهٔ درخت می‌رود، و از آذر تا اسفند خالی است و درپوشی چوبی آن را نیمکت می‌کند. درون ۱− حوضی نیست، تا کف برای مراسم و باشگاه باز بماند.</p>"],
hLink:["The link with −1","پیوند با ۱−"],
link:["<ul><li><b>The caretaker has moved.</b> The iteration 4 brief puts the caretaker on F2 and no home on −1, so iteration 3's screened corner outside the caretaker's door is gone, and the whole court side of −1 opens to the court.</li><li><b>Glass front</b> along x 0.6–7.8, floor to 2.5 m; a solid wall behind the stair's landing and store.</li><li><b>Doors:</b> a pair of hinged glass doors, 2 × 0.8 m (1.6 m clear), at x 6.2–7.8 on the line from the lift door (x ≈ 7.0). They open <b>outward</b>: the way out, and they seal better against driving rain. Under the bridge and balcony, snow doesn't block them. Each leaf folds back 180° to rest on the facade: the west leaf on the fixed glass (with a buffer), the east leaf on the solid wall behind the bottom landing. Floor stops hold them open. No sliding doors.</li><li><b>Line of sight:</b> from the lift door the eye runs along x ≈ 6.6–7.8, through the doors, to the tree. Iteration 3 had the shower and WC across it; iteration 4's −1 should move them aside, for example west by riser R2 or R3.</li><li><b>A gathering spills out</b> through the doors to the covered strip (about 5 m² under the balcony and bridge), the paved court (about 21 m²) and the basin's rim as a seat: about 20 standing, or a table of eight. Guests can also arrive and leave by the stair.</li><li><b>Numbers:</b> a whole −1 used for events could pass 50 people, the assembly limit; see the checks.</li></ul>","<ul><li><b>سرایدار جابه‌جا شده.</b> شرح دور چهارم سرایدار را در طبقهٔ دوم می‌گذارد و در ۱− خانه‌ای نیست، پس گوشهٔ پوشیدهٔ بیرون در سرایدار در دور سوم دیگر نیست و تمام سمت گودالِ ۱− رو به گودال باز می‌شود.</li><li><b>جبههٔ شیشه‌ای</b> در x ۰٫۶ تا ۷٫۸، از کف تا ۲٫۵ متر؛ دیواری پر پشت پاگرد و انبار پله.</li><li><b>درها:</b> یک جفت در شیشه‌ای لولایی، ۲ × ۰٫۸ متر (۱٫۶ متر باز)، در x ۶٫۲ تا ۷٫۸ روی خط دید از در آسانسور (x حدود ۷٫۰). <b>رو به بیرون</b> باز می‌شوند: سمت خروج، و در برابر باران بادخور بهتر آب‌بندی می‌کنند. زیر پل و بالکن‌اند و برف جلویشان را نمی‌گیرد. هر لنگه ۱۸۰ درجه برمی‌گردد و روی نما می‌نشیند: لنگهٔ غربی روی شیشهٔ ثابت (با ضربه‌گیر)، لنگهٔ شرقی روی دیوار پر پشت پاگرد پایین. نگهدارندهٔ کفی بازشان نگه می‌دارد. در کشویی نه.</li><li><b>خط دید:</b> از در آسانسور نگاه در امتداد x حدود ۶٫۶ تا ۷٫۸ از میان درها تا درخت می‌رود. در دور سوم دوش و سرویس روی این خط بودند؛ در ۱− دور چهارم باید کنار بروند، مثلاً به غرب کنار رایزر R2 یا R3.</li><li><b>دورهمی بیرون می‌ریزد</b> از درها به نوار سرپوشیده (حدود ۵ متر مربع زیر بالکن و پل)، گودال سنگ‌فرش (حدود ۲۱ متر مربع) و لبهٔ حوض به‌عنوان نشیمن: حدود ۲۰ نفر ایستاده یا میزی هشت‌نفره. مهمان‌ها از پله هم می‌آیند و می‌روند.</li><li><b>شمار افراد:</b> اگر همهٔ ۱− برای مراسم به کار رود ممکن است از ۵۰ نفر، مرز تجمع، بگذرد؛ بررسی‌ها را ببینید.</li></ul>"],
hSeasons:["Through the seasons","در گذر فصل‌ها"],
seasons:["<ul><li><b>Winter (دی–اسفند):</b> a view, not a place to sit. Snow on the white trunk, the basin under its lid as a bench, one lamp on the tree for winter evenings (شب یلدا) seen from inside. Doors closed; the court is the way out only in an emergency.</li><li><b>Spring (فروردین–خرداد):</b> the birch's catkins shed pollen in فروردین–اردیبهشت, then it leafs out; keep the doors shut on windy pollen days if anyone is allergic. The basin is filled; doors open on mild days, morning exercise with the doors open; gatherings outside from late اردیبهشت.</li><li><b>Summer (تیر–شهریور):</b> the best season. The coolest outdoor place in the building, as the old sunken courts were. Water the tree and paving in the evening for coolness. Keep evening events moderate: the 19 m slot carries sound to every window.</li><li><b>Autumn (مهر–آذر):</b> the birch turns yellow and drops small leaves, then seeds into winter. Clear leaves from the channel and gullies weekly; empty the basin in آذر.</li></ul>","<ul><li><b>زمستان (دی تا اسفند):</b> چشم‌انداز، نه جای نشستن. برف روی تنهٔ سفید، حوض زیر درپوشش به‌عنوان نیمکت، یک چراغ روی درخت برای شب‌های زمستان (شب یلدا) که از درون دیده می‌شود. درها بسته؛ گودال فقط در اضطرار راه خروج است.</li><li><b>بهار (فروردین تا خرداد):</b> شاتون‌های توس در فروردین و اردیبهشت گرده می‌ریزند و بعد برگ می‌دهد؛ اگر کسی حساسیت دارد، در روزهای بادی درها را ببندید. حوض پر می‌شود؛ در روزهای معتدل درها باز، ورزش صبح با درهای باز؛ دورهمی بیرون از اواخر اردیبهشت.</li><li><b>تابستان (تیر تا شهریور):</b> بهترین فصل. خنک‌ترین جای بیرونی ساختمان، مانند گودال باغچه‌های قدیم. عصرها درخت و سنگ‌فرش را آب بدهید تا خنک شود. مراسم شبانه را آرام نگه دارید: شکاف ۱۹ متری صدا را به همهٔ پنجره‌ها می‌برد.</li><li><b>پاییز (مهر تا آذر):</b> توس زرد می‌شود و برگ‌های ریز و سپس تا زمستان بذر می‌ریزد. برگ‌ها را هر هفته از آبرو و کف‌شوی‌ها بردارید؛ حوض را در آذر خالی کنید.</li></ul>"],
hPrivacy:["Privacy","حریم"],
privacy:["<ul><li><b>The rear building:</b> in Iranian practice a building on the boundary usually has a blank wall towards the neighbour, since overlooking is restricted. Confirm what the rear neighbour may open. If blank, only our own homes overlook the court.</li><li><b>Our homes above:</b> the covered strip under the balcony is hidden from all the yard windows above, so it is the private part. The tree's crown screens the middle from F1 and F2.</li><li><b>The quiet corner:</b> the caretaker's corner becomes a quiet corner for one or two, west and rear behind the tree (about x 1.05–4.1, y 16.1–18.9), with a bench against the west wall. No screen is needed now; if −1 puts a quiet room or the gym on the west, a planted trellis 1.8 m high can give it its own corner.</li></ul>","<ul><li><b>ساختمان پشتی:</b> در عمل معمول ایران ساختمانی که روی مرز است معمولاً دیواری بی‌پنجره رو به همسایه دارد، چون اشراف محدود است. بپرسید همسایهٔ پشتی چه بازشویی مجاز است. اگر بی‌پنجره باشد، فقط خانه‌های خود ما به گودال اشراف دارند.</li><li><b>خانه‌های ما در بالا:</b> نوار سرپوشیدهٔ زیر بالکن از همهٔ پنجره‌های رو به حیاط بالا پنهان است، پس بخش خصوصی است. تاج درخت میانهٔ گودال را از طبقهٔ اول و دوم می‌پوشاند.</li><li><b>گوشهٔ آرام:</b> گوشهٔ سرایدار گوشه‌ای آرام برای یکی دو نفر می‌شود، غرب و پشت، پشت درخت (حدود x ۱٫۰۵ تا ۴٫۱، y ۱۶٫۱ تا ۱۸٫۹)، با نیمکتی کنار دیوار غربی. اکنون پرده‌ای لازم نیست؛ اگر ۱− اتاق آرام یا باشگاه را در غرب بگذارد، داربستی کاشته به ارتفاع ۱٫۸ متر گوشهٔ خودش را می‌دهد.</li></ul>"],
hUpkeep:["Maintenance and cost","نگهداری و هزینه"],
upkeep:["<ul><li><b>Every year:</b> prune the birch only in late summer or autumn, since it bleeds sap if cut in spring; drip water every summer; leaves off the channel, gullies and sump grating, weekly in autumn; test both pumps and the alarm before winter and service them; drain the outdoor water before frost; check the guards and nosings; wash the glass. Drip irrigation checked each spring. The light finish on the walls renewed about every 10 years.</li><li><b>Cost:</b> no reliable Qazvin prices were found, so these are quantities to price: paving about 24 m²; soil 17.2 m³ plus soil cells under about 20 m²; light finish on our retaining walls about 41 m²; 17.6 m² of glass with one pair of doors; a concrete dog-leg stair, 18 risers, two landings, about 12 m of guard; one sump with two pumps, alarm and looped rising main; a stone basin 2.4 × 1.0 m with a lid; one upright birch 4–5 m tall, a rain tank of about 5 m³ with drip lines, and about 10 m² of shade planting.</li><li><span class='tag j'>judgement</span> The stair, the glass and the pumps cost the most, the planting the least. A dog-leg costs about the same as the straight stair in concrete and adds a landing and the store.</li></ul>","<ul><li><b>هر سال:</b> هرس توس فقط در آخر تابستان یا پاییز، چون در بهار شیره می‌دهد؛ آبیاری قطره‌ای هر تابستان؛ برداشتن برگ از آبرو، کف‌شوی‌ها و توری چاهک، در پاییز هر هفته؛ آزمایش هر دو پمپ و هشدار پیش از زمستان و سرویس آن‌ها؛ تخلیهٔ آب بیرونی پیش از یخبندان؛ بررسی جان‌پناه‌ها و دماغهٔ پله‌ها؛ شستن شیشه. آبیاری قطره‌ای هر بهار بررسی شود. پوشش روشن دیوارها حدود هر ۱۰ سال نو شود.</li><li><b>هزینه:</b> قیمت قابل‌اعتمادی از قزوین پیدا نشد، پس این‌ها مقدارهایی برای قیمت‌گیری‌اند: سنگ‌فرش حدود ۲۴ متر مربع؛ خاک ۱۷٫۲ متر مکعب به‌علاوهٔ سلول خاک زیر حدود ۲۰ متر مربع؛ پوشش روشن دیوارهای حائل ما حدود ۴۱ متر مربع؛ ۱۷٫۶ متر مربع شیشه با یک جفت در؛ پلهٔ دوبازوی بتنی، ۱۸ پله، دو پاگرد، حدود ۱۲ متر جان‌پناه؛ یک چاهک با دو پمپ، هشدار و لولهٔ رانش حلقه‌دار؛ حوض سنگی ۲٫۴ × ۱٫۰ متر با درپوش؛ یک توس ستونی ۴ تا ۵ متری، مخزن باران حدود ۵ متر مکعب با لوله‌های قطره‌ای، و حدود ۱۰ متر مربع کاشت سایه‌پسند.</li><li><span class='tag j'>قضاوت</span> پله، شیشه و پمپ‌ها پرهزینه‌ترین‌اند و کاشت کم‌هزینه‌ترین. پلهٔ دوبازو در بتن تقریباً هم‌قیمت پلهٔ یک‌طرفه است و یک پاگرد و انبار می‌افزاید.</li></ul>"],
hAdopt:["What iteration 4 should adopt","آنچه دور چهارم باید بپذیرد"],subAdopt:["Proposals to the agent drawing iteration 4; the plan data is theirs. Plan axes in metres.","پیشنهادهایی برای عاملی که دور چهارم را می‌کشد؛ دادهٔ نقشه از آن اوست. محورهای نقشه به متر."],

hChecks:["Engineer and landscape checks","بررسی‌های مهندس و منظر"],
checks:["<ul><li><b>Structural:</b> retaining walls on the west and rear boundaries (3.1 m of soil plus the neighbours' footings), their toes clear of the tree pit; the dog-leg stair and its store; the bridge; the balconies over the court if they are cut.</li><li><b>Geotechnical:</b> soil, water table, perched water and old qanats under the court; whether a soakaway is allowed; a wet tree pit near footings and −2's walls.</li><li><b>Drainage:</b> the design rain for Qazvin in place of our 40 mm/h; the sewer's depth and the pumped loop; pump size, alarm, backup power; the channel at the threshold; no other building draining into the court.</li><li><b>Fire and municipality:</b> the court stair as −1's second exit; −1's occupancy against the 50-person assembly limit; whether the court passes the sunken-court rule (at least 4.5 m wide, 20 m², open to the sky) as an L of 4.5 × 5.5 m west of the balconies; use of the basement for gatherings and a gym; guard height.</li><li><b>Landscape:</b> a birch 'Fastigiata' from local stock, and how it copes with Qazvin's summer heat and alkaline soil; soil mix and drainage; the root barrier; drip from stored water; pruning to stay narrow.</li><li><b>Glass:</b> toughened or laminated for a gym; the cold bridge at the threshold; drop seals; hold-open stays.</li></ul>","<ul><li><b>سازه:</b> دیوارهای حائل روی مرز غربی و پشتی (۳٫۱ متر خاک به‌علاوهٔ پی همسایه‌ها)، با پنجهٔ پی دور از چالهٔ درخت؛ پلهٔ دوبازو و انبارش؛ پل؛ بالکن‌های روی گودال اگر کوتاه شوند.</li><li><b>ژئوتکنیک:</b> خاک، سطح آب، آب معلق و قنات‌های قدیمی زیر گودال؛ مجاز بودن چاه جذبی؛ چالهٔ خیس درخت نزدیک پی‌ها و دیوارهای ۲−.</li><li><b>زهکشی:</b> بارش طرح قزوین به جای ۴۰ میلی‌متر در ساعت ما؛ عمق فاضلاب و حلقهٔ پمپ؛ اندازهٔ پمپ، هشدار، برق پشتیبان؛ آبروی آستانه؛ اینکه هیچ ساختمان دیگری به گودال نریزد.</li><li><b>آتش‌نشانی و شهرداری:</b> پلهٔ گودال به‌عنوان راه دوم خروج ۱−؛ ظرفیت ۱− در برابر مرز ۵۰ نفرهٔ تجمع؛ اینکه گودال ضابطهٔ حیاط گود (دست‌کم ۴٫۵ متر پهنا، ۲۰ متر مربع، رو به آسمان) را به‌صورت L با ۴٫۵ × ۵٫۵ متر در غرب بالکن‌ها پاس می‌کند یا نه؛ کاربری زیرزمین برای دورهمی و باشگاه؛ ارتفاع جان‌پناه.</li><li><b>منظر:</b> توس ستونی از نهال محلی، و تاب‌آوری‌اش در گرمای تابستان و خاک قلیایی قزوین؛ ترکیب خاک و زهکشی؛ مانع ریشه؛ آبیاری قطره‌ای از آب ذخیره؛ هرس برای باریک ماندن.</li><li><b>شیشه:</b> سکوریت یا لمینیت برای باشگاه؛ پل سرمایی آستانه؛ نوار آب‌بند؛ نگهدارندهٔ باز در.</li></ul>"],
hQuestions:["Questions for the owner","پرسش‌ها از صاحب‌کار"],
questions:["<ol><li><b>The birch:</b> is the upright form ('Fastigiata', 8–12 m) acceptable, rather than the plain species, which would grow taller but press on the balconies? Is anyone in the family allergic to birch pollen?</li><li><b>The hoz:</b> is a raised basin outside the glass, emptied in winter, an acceptable replacement?</li><li><b>The rear neighbour:</b> will their wall towards us be blank? Could they finish it in a light colour?</li><li><b>Balconies:</b> if the municipality reads the rule strictly, would first-floor balconies 1.2 m deep over the court be acceptable instead of 1.8 m?</li><li><b>Events:</b> how many people at the biggest gathering? Above about 50, the rules change.</li><li><b>Stair roof:</b> a light glass roof over the court stair against ice, or rails and rough treads only?</li><li><b>The quiet corner:</b> with the caretaker upstairs, is a bench behind the tree what you want there?</li></ol>","<ol><li><b>توس:</b> آیا فرم ستونی ('Fastigiata'، ۸ تا ۱۲ متر) به جای گونهٔ معمولی، که بلندتر می‌شود اما به بالکن‌ها فشار می‌آورد، پذیرفتنی است؟ آیا کسی در خانواده به گردهٔ توس حساسیت دارد؟</li><li><b>حوض:</b> آیا حوض برجسته بیرون شیشه که زمستان خالی می‌شود جایگزین پذیرفتنی است؟</li><li><b>همسایهٔ پشتی:</b> آیا دیوارشان رو به ما بی‌پنجره خواهد بود؟ می‌توانند آن را روشن رنگ کنند؟</li><li><b>بالکن‌ها:</b> اگر شهرداری ضابطه را سخت بخواند، آیا بالکن ۱٫۲ متری طبقهٔ اول روی گودال به جای ۱٫۸ متر پذیرفتنی است؟</li><li><b>مراسم:</b> بزرگ‌ترین دورهمی چند نفر است؟ بالای حدود ۵۰ نفر، قاعده‌ها عوض می‌شوند.</li><li><b>سقف پله:</b> سقف شیشه‌ای سبک بالای پلهٔ گودال برای یخ، یا فقط دستگیره و کف زبر؟</li><li><b>گوشهٔ آرام:</b> با سرایدار در طبقهٔ بالا، آیا نیمکتی پشت درخت همان است که آنجا می‌خواهید؟</li></ol>"],
hMethod:["How it is worked out, and sources","روش محاسبه و منابع"],
method:["<p><b>Numbers.</b> <code>court/court_study.py</code> copies iteration 3, changes the court, its stair, the bridge and the balconies for each variant, and runs the sun tool's own functions (<code>daylight.py</code>, read-only): sun every 6 minutes on four days, a clear sky for sun and an overcast sky for the sky component. Variant A reproduces the tool's own court numbers exactly (<code>court/test_court.py</code>). The tool counts direct sky only, not reflected light. Rainfall, snow and pump figures are assumptions for the engineer to replace.</p><p><b>The traditional reference.</b> In a study of 40 houses in Yazd, most sunken courts are 3–4 m deep and one storey, a few over 6 m and two storeys; they run north-east to south-west, with semi-open rooms between the closed rooms and the court that are very cool in summer when the court's trees are watered (Omidvari and Basouli, 1400). Our 3.12 m court is the common kind, but it sits at the bottom of a canyon, not inside an open yard. No measured source on Qazvin's own sunken courts was found.</p><p><b>Sources</b>, read 7 Nov 2026: <a href='https://iic.ihss.ac.ir/Journal/DownloadFile/19955'>Omidvari and Basouli, sunken courts of Yazd</a>; <a href='https://nhbc-standards.co.uk/4-foundations/4-2-building-near-trees/4-2-4-the-effects-of-trees-on-shrinkable-soils/'>NHBC Standards 4.2.4</a> (through search excerpts); <a href='https://minnesotawildflowers.info/tree/white-poplar'>white poplar</a>; <a href='https://www.ndsu.edu/agriculture/node/10953'>NDSU</a>; <a href='https://weeds.org.au/profiles/lombardy-poplar-black/'>Lombardy and black poplar</a>; <a href='https://plants.ces.ncsu.edu/plants/all/populus-nigra'>NC State, black poplar</a>; <a href='https://exetertrees.uk/poplar-lombardy.html'>Lombardy poplar, UK</a>; <a href='https://hort.ifas.ufl.edu/database/documents/pdf/tree_fact_sheets/ginbila.pdf'>ginkgo 'Fastigiata'</a>; <a href='https://edis.ifas.ufl.edu/publication/ST137/pdf'>hackberry</a>; <a href='https://landscapeplants.aub.edu.lb/Plants/PlantProfile/ae32a761-77c2-4f2f-8008-94333d43ceb4'>hackberry, AUB</a>; <a href='https://extension.usu.edu/treebrowser/catalog/parrotia-persian'>Persian ironwood, Utah State</a>; <a href='https://plants.ces.ncsu.edu/plants/parrotia-persica/common-name/iron-tree'>NC State</a>; <a href='https://extension.psu.edu/tough-and-beautiful-is-hard-to-beat'>Penn State</a>; <a href='https://hgic.clemson.edu/factsheet/persian-parrotia/'>Clemson</a>. The full write-up is <code>court/court-design.md</code>.</p>","<p><b>عددها.</b> <code>court/court_study.py</code> از دور سوم نسخه برمی‌دارد، برای هر گزینه گودال، پله، پل و بالکن‌ها را تغییر می‌دهد و تابع‌های خود ابزار آفتاب (<code>daylight.py</code>، فقط‌خواندنی) را اجرا می‌کند: آفتاب هر ۶ دقیقه در چهار روز، آسمان صاف برای آفتاب و آسمان ابری برای مؤلفهٔ آسمان. گزینهٔ A عددهای خود ابزار را دقیقاً بازتولید می‌کند (<code>court/test_court.py</code>). ابزار فقط آسمان مستقیم را می‌شمارد، نه نور بازتابی. عددهای باران، برف و پمپ فرض‌هایی‌اند که مهندس باید جایگزین کند.</p><p><b>نمونهٔ سنتی.</b> در بررسی ۴۰ خانه در یزد، بیشتر گودال باغچه‌ها ۳ تا ۴ متر عمق دارند و یک‌طبقه‌اند، چندتایی بیش از ۶ متر و دوطبقه؛ در راستای شمال‌شرق به جنوب‌غرب‌اند، و فضاهای نیمه‌باز میان اتاق‌های بسته و گودال وقتی درختان گودال آب داده شوند در تابستان بسیار خنک‌اند (امیدواری و باصولی، ۱۴۰۰). گودال ۳٫۱۲ متری ما از نوع رایج است، اما ته یک دره نشسته، نه درون حیاطی باز. منبع اندازه‌گیری‌شده‌ای دربارهٔ گودال باغچه‌های خود قزوین پیدا نشد.</p><p><b>منابع</b>، خوانده‌شده در ۷ نوامبر ۲۰۲۶: <a href='https://iic.ihss.ac.ir/Journal/DownloadFile/19955'>امیدواری و باصولی، گودال باغچه‌های یزد</a>؛ <a href='https://nhbc-standards.co.uk/4-foundations/4-2-building-near-trees/4-2-4-the-effects-of-trees-on-shrinkable-soils/'>NHBC بخش ۴٫۲٫۴</a> (از گزیده‌های جست‌وجو)؛ <a href='https://minnesotawildflowers.info/tree/white-poplar'>سپیدار</a>؛ <a href='https://www.ndsu.edu/agriculture/node/10953'>NDSU</a>؛ <a href='https://weeds.org.au/profiles/lombardy-poplar-black/'>تبریزی و صنوبر سیاه</a>؛ <a href='https://plants.ces.ncsu.edu/plants/all/populus-nigra'>NC State، صنوبر سیاه</a>؛ <a href='https://exetertrees.uk/poplar-lombardy.html'>تبریزی، بریتانیا</a>؛ <a href='https://hort.ifas.ufl.edu/database/documents/pdf/tree_fact_sheets/ginbila.pdf'>جینکو 'Fastigiata'</a>؛ <a href='https://edis.ifas.ufl.edu/publication/ST137/pdf'>داغداغان</a>؛ <a href='https://landscapeplants.aub.edu.lb/Plants/PlantProfile/ae32a761-77c2-4f2f-8008-94333d43ceb4'>داغداغان، دانشگاه آمریکایی بیروت</a>؛ <a href='https://extension.usu.edu/treebrowser/catalog/parrotia-persian'>انجیلی، یوتا</a>؛ <a href='https://plants.ces.ncsu.edu/plants/parrotia-persica/common-name/iron-tree'>NC State</a>؛ <a href='https://extension.psu.edu/tough-and-beautiful-is-hard-to-beat'>Penn State</a>؛ <a href='https://hgic.clemson.edu/factsheet/persian-parrotia/'>Clemson</a>. متن کامل <code>court/court-design.md</code> است.</p>"],
built:["Built {d} from court-results.json. Rebuild with: python3 court/build_court.py --run","ساخته‌شده در {d} از court-results.json. ساخت دوباره: python3 court/build_court.py --run"],
lgH:["hours of sun","ساعت آفتاب"],lgTree:["tree crown","تاج درخت"],lgGlass:["glass front","جبههٔ شیشه‌ای"],

/* ---------- Language: the same system and shared preference as the other pages ---------- */
const LANG_KEY="khooneh-lang",STORE="khooneh-court";
const params=new URLSearchParams(typeof location!=="undefined"?location.search:"");
function initialLang(){const q=params.get("lang");if(q==="fa"||q==="en")return q;try{const s=localStorage.getItem(LANG_KEY);if(s==="fa"||s==="en")return s;}catch(e){}return String((typeof navigator!=="undefined"&&navigator.language)||"").toLowerCase().startsWith("fa")?"fa":"en";}
let LANG=initialLang();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=(x,lang=LANG)=>x===null||x===undefined?"":typeof x==="object"?(x[lang]||x.en||""):String(x);
const t=(k,lang=LANG)=>{const e=I18N[k];return e?e[lang==="fa"?1:0]:k;};
const faDigits=s=>String(s).replace(/(\d)\.(\d)/g,"$1٫$2").replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const D=(x,lang=LANG)=>lang==="fa"?faDigits(x):String(x);
const N=(v,d=1)=>v===null||v===undefined?"–":D(Number(v).toFixed(d));
const fill=(s,o)=>s.replace(/\{(\w+)\}/g,(m,k)=>k in o?o[k]:m);
function load(){try{return JSON.parse(localStorage.getItem(STORE)||"{}");}catch(e){return {};}}
const saved=load();
const state={variant:saved.variant||"C",scenario:saved.scenario||PIPE.main,day:saved.day||"jun",sunVar:saved.sunVar||"C"};
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}
const V=k=>PIPE.variants.find(v=>v.key===k);
const scName=k=>{const s=PIPE.site.scenarios.find(x=>x.key===k);return s?L(s):k;};
const dayName=k=>{const d=PIPE.site.days.find(x=>x.key===k);return d?L(d):k;};
function group(items,cur,on){return `<span class="group">${items.map(([k,lab])=>`<button type="button" data-k="${esc(k)}" class="${k===cur?"on":""}">${esc(lab)}</button>`).join("")}</span>`;}
function wire(id,attr,cb){$(id).querySelectorAll(`[data-g="${attr}"] button`).forEach(b=>b.onclick=()=>{cb(b.dataset.k);save();render();});}
function picker(id,parts){$(id).innerHTML=parts.map(([g,label,items,cur])=>`<span>${esc(label)}</span><span data-g="${g}">${group(items,cur)}</span>`).join("");}
const scItems=()=>PIPE.site.scenarios.map(s=>[s.key,L(s)+(s.key===PIPE.main?" ★":"")]);

/* ---------- Sections ---------- */
function renderNav(){const items=[["s-rec","navRec"],["s-var","navVar"],["s-sun","navSun"],["s-birch","navBirch"],["s-tree","navTree"],["s-light","navLight"],["s-stair","navStair"],["s-water","navWater"],["s-link","navLink"],["s-seasons","navSeasons"],["s-upkeep","navUpkeep"],["s-adopt","navAdopt"],["s-checks","navChecks"],["s-method","navMethod"]];
  $("nav").innerHTML=items.map(([id,k])=>`<a href="#${id}">${esc(t(k))}</a>`).join("");}
function renderVariants(){const v=V(state.variant);
  picker("var-pick",[["v",t("pVar"),PIPE.variants.map(x=>[x.key,x.key+". "+L(x.name)]),state.variant]]);
  wire("var-pick","v",k=>state.variant=k);
  $("var-about").innerHTML=`<b>${esc(v.key+". "+L(v.name))}.</b> ${esc(L(v.about))}`;
  $("plan").innerHTML=v.svg[LANG].plan;$("section").innerHTML=v.svg[LANG].section;
  picker("sc-pick",[["s",t("pCase"),scItems(),state.scenario]]);wire("sc-pick","s",k=>state.scenario=k);
  const sc=state.scenario;
  const head=`<tr><th>${esc(t("thVar"))}</th><th class="n">${esc(t("thSize"))}</th><th class="n">${esc(t("thFloorA"))}</th><th class="n">${esc(t("thFloor"))}</th><th class="n">${esc(t("thCrown6"))}</th><th class="n">${esc(t("thBeds"))}</th><th class="n">${esc(t("thSky"))}</th><th class="n">${esc(t("thAdf"))}</th><th class="n">${esc(t("thGsun"))}</th></tr>`;
  const rows=PIPE.variants.map(x=>{const c=x.court[sc],g=x.glass[sc],s=x.sizes;
    return `<tr class="${x.key===state.variant?"sel":""} ${x.key==="C"?"rec":""}"><td>${esc(x.key+". "+L(x.name))}</td><td class="n">${D(s.width)} × ${D(s.floor_depth)}</td><td class="n">${N(s.floor_m2)}</td><td class="n">${N(c.mean.dec)} / ${N(c.mean.mar)} / ${N(c.mean.jun)}</td><td class="n">${N(c.tree.dec["6.0"])} / ${N(c.tree.jun["6.0"])}</td><td class="n">${N(c.beds.jun)}</td><td class="n">${N(g.vsc)}%</td><td class="n">${N(g.adf)}%</td><td class="n">${N(g.sun.jun)} / ${N(g.sun.aug)}</td></tr>`;}).join("");
  $("var-table").innerHTML=`<table><thead>${head}</thead><tbody>${rows}</tbody></table>`;}
function colour(h){const stops=[[0,[68,84,106]],[1,[110,140,150]],[2,[170,180,140]],[4,[235,200,95]],[7,[242,170,40]]];
  if(h<=0)return "rgb(52,64,80)";for(let i=1;i<stops.length;i++){if(h<=stops[i][0]){const [a,ca]=stops[i-1],[b,cb]=stops[i],f=(h-a)/(b-a);return `rgb(${ca.map((c,j)=>Math.round(c+(cb[j]-c)*f)).join(",")})`;}}return "rgb(242,170,40)";}
function sunSvg(v,sc,day){const s=40,X0=-0.3,Y0=13.7,X1=10.8,Y1=20.4,px=x=>((x-X0)*s).toFixed(1),py=y=>((y-Y0)*s).toFixed(1);
  const c=v.court[sc],g=c.grid,hrs=c.hours[day];const out=[`<svg class="plan" viewBox="0 0 ${((X1-X0)*s).toFixed(0)} ${((Y1-Y0)*s).toFixed(0)}" role="img">`];
  out.push(`<rect x="${px(0)}" y="${py(14)}" width="${(10.5*s).toFixed(1)}" height="${(6.14*s).toFixed(1)}" fill="#E8E2D2"/>`);
  g.cells.forEach(([i,j],k)=>{out.push(`<rect x="${px(g.x0+i*g.gx)}" y="${py(g.y0+j*g.gy)}" width="${(g.gx*s+0.4).toFixed(1)}" height="${(g.gy*s+0.4).toFixed(1)}" fill="${colour(hrs[k])}"><title>${D(hrs[k])} h</title></rect>`);});
  const sp=v.spec,R=(r,st,dash)=>`<rect x="${px(r[0])}" y="${py(r[1])}" width="${((r[2]-r[0])*s).toFixed(1)}" height="${((r[3]-r[1])*s).toFixed(1)}" fill="none" stroke="${st}" stroke-width="1.2" ${dash?'stroke-dasharray="4 3"':""}/>`;
  sp.stair.forEach(r=>out.push(R(r,"#FCFCFA",false)));if(sp.pit)out.push(R(sp.pit,"#D9C7A6",true));
  out.push(`<line x1="${px(0.25)}" y1="${py(14)}" x2="${px(10.25)}" y2="${py(14)}" stroke="#171D1C" stroke-width="3"/>`);
  sp.glass.forEach(([a,b])=>out.push(`<line x1="${px(a)}" y1="${py(14)}" x2="${px(b)}" y2="${py(14)}" stroke="#4F8FB0" stroke-width="4"/>`));
  if(sp.balcony_y>14.05)out.push(`<line x1="${px(4.75)}" y1="${py(sp.balcony_y)}" x2="${px(10.25)}" y2="${py(sp.balcony_y)}" stroke="#FCFCFA" stroke-width="1.2" stroke-dasharray="2 3"/>`);
  out.push(`<circle cx="${px(v.tree[0])}" cy="${py(v.tree[1])}" r="${(1.75*s).toFixed(1)}" fill="none" stroke="#9FE08F" stroke-width="1.5" stroke-dasharray="5 3"/><circle cx="${px(v.tree[0])}" cy="${py(v.tree[1])}" r="4" fill="#9FE08F"/>`);
  out.push(`<rect x="${px(-0.3)}" y="${py(20.14)}" width="${(11.1*s).toFixed(1)}" height="${(0.26*s).toFixed(1)}" fill="#9AA19C"/>`);
  out.push("</svg>");return out.join("");}
function renderSun(){picker("sun-pick",[["v",t("pVar"),PIPE.variants.map(x=>[x.key,x.key]),state.sunVar],["s",t("pCase"),scItems(),state.scenario],["d",t("pDay"),PIPE.site.days.map(d=>[d.key,L(d)]),state.day]]);
  wire("sun-pick","v",k=>state.sunVar=k);wire("sun-pick","s",k=>state.scenario=k);wire("sun-pick","d",k=>state.day=k);
  const v=V(state.sunVar);$("sunmap").innerHTML=sunSvg(v,state.scenario,state.day);
  const m=v.court[state.scenario].mean[state.day];
  $("sun-legend").innerHTML=[0,0.5,1,2,3,4,6].map(h=>`<span><i style="background:${colour(h)}"></i>${D(h)}${h===6?"+":""}</span>`).join("")+`<span>${esc(t("lgH"))}</span><span>· ${esc(dayName(state.day))}: ${N(m)} h</span><span><i style="background:none;border:2px dashed #5E9A55"></i>${esc(t("lgTree"))}</span><span><i style="background:#4F8FB0"></i>${esc(t("lgGlass"))}</span>`;
  const hs=PIPE.treeHeights.filter(h=>h>=3),c=v.court[state.scenario];
  const head=`<tr><th class="n">${esc(t("thHeight"))}</th><th class="n">${esc(t("thAbove"))}</th>${PIPE.site.days.map(d=>`<th class="n">${esc(L(d))}</th>`).join("")}</tr>`;
  $("crown").innerHTML=`<table><thead>${head}</thead><tbody>${hs.map(h=>{const k=h.toFixed(1);return `<tr><td class="n">${D(h)} m</td><td class="n">${D((h-3.12>0?"+":"")+(h-3.12).toFixed(1))}</td>${PIPE.site.days.map(d=>`<td class="n">${N(c.tree[d.key][k])}</td>`).join("")}</tr>`;}).join("")}</tbody></table>`;}
function renderSpecies(){const cols=["thTreeN","thTsize","thRoots","thDemand","thWater","thShade","thLife","thMess","thPollen","thGround","thVerdict"];
  $("species").innerHTML=`<table><thead><tr>${cols.map(c=>`<th>${esc(t(c))}</th>`).join("")}</tr></thead><tbody>${PIPE.species.map(s=>`<tr><td><b>${esc(L(s.name))}</b></td><td>${esc(L(s.size))}</td><td>${esc(L(s.roots))}</td><td>${esc(L(s.demand))}</td><td>${esc(L(s.water))}</td><td>${esc(L(s.shade))}</td><td>${esc(L(s.life))}</td><td>${esc(L(s.mess))}</td><td>${esc(L(s.pollen))}</td><td>${esc(L(s.ground))}</td><td class="${s.cls}">${esc(L(s.verdict))}</td></tr>`).join("")}</tbody></table>`;}
function renderBirch(){const f=PIPE.species.find(x=>x.key==="birch-fastigiata"),p=PIPE.species.find(x=>x.key==="birch"),b=PIPE.birch,src=PIPE.birchSources;
  const rows=[["fHeight","size"],["fGrowth","growth"],["fRoots","roots"],["fZone","demand"],["fWater","water"],["fShade","shade"],["fLife","life"],["fPollen","pollen"],["fMess","mess"]];
  const yrs=k=>{const r=b.forms[k].years_to_mature;return r?{en:D(r[0])+"–"+D(r[1]),fa:D(r[0])+" تا "+D(r[1])}:null;};
  $("birch-profile").innerHTML=`<table><thead><tr><th></th><th>${esc(t("thUpright"))}</th><th>${esc(t("thPlain"))}</th></tr></thead><tbody>${rows.map(([k,fld])=>`<tr><td><b>${esc(t(k))}</b></td><td>${esc(L(f[fld]))}</td><td>${esc(L(p[fld]))}</td></tr>`).join("")}<tr><td><b>${esc(t("fYears"))}</b></td><td>${esc(L(yrs("birch-fastigiata")))}</td><td>${esc(L(yrs("birch")))}</td></tr><tr><td><b>${esc(t("fSources"))}</b></td><td colspan="2" class="small">${src.map((u,i)=>`<a href="${esc(u)}">${D(i+1)}</a>`).join(" · ")}</td></tr></tbody></table>`;
  const sc=state.scenario,cr=b.crown[sc],yr=(k,h)=>{const v=b.years[k][String(Math.round(h))];return v?D(v[0])+"–"+D(v[1]):"–";};
  const head=`<tr><th class="n">${esc(t("thHeight"))}</th><th class="n">${esc(t("thAbove"))}</th>${PIPE.site.days.map(d=>`<th class="n">${esc(L(d))}</th>`).join("")}<th class="n">${esc(t("thYearsF"))}</th><th class="n">${esc(t("thYearsS"))}</th></tr>`;
  $("birch-sun").innerHTML=`<div class="controls"><span>${esc(t("pCase"))}: ${esc(scName(sc))}</span></div><table><thead>${head}</thead><tbody>${b.heights.map(h=>{const v=cr[h.toFixed(1)];return `<tr><td class="n">${D(h)} m</td><td class="n">${D("+"+(h-3.12).toFixed(1))}</td>${PIPE.site.days.map(d=>`<td class="n">${N(v[d.key])}</td>`).join("")}<td class="n">${yr("birch-fastigiata",h)}</td><td class="n">${yr("birch",h)}</td></tr>`;}).join("")}</tbody></table>`;
  const ir=b.irrigation["birch-fastigiata"],ir2=b.irrigation.birch;
  $("birch-care").innerHTML=fill(t("birchCare"),{tl:D(ir.tree_l_day),bl:D(ir.beds_l_day),sm:D(ir.season_m3),tk:D(ir.tank_m3),rh:D(ir.roof_harvest_m3_year),sm2:D(ir2.season_m3)});}
function renderGlass(){const sc=state.scenario;
  const head=`<tr><th>${esc(t("thChange"))}</th><th class="n">${esc(t("thSky"))}</th><th class="n">${esc(t("thAdf"))}</th><th class="n">${esc(t("thNosky"))}</th><th class="n">${esc(t("thGsun"))}</th></tr>`;
  const row=(name,g,cls)=>`<tr class="${cls||""}"><td>${esc(name)}</td><td class="n">${N(g.vsc)}%</td><td class="n">${g.adf===undefined?"–":N(g.adf)+"%"}</td><td class="n">${g.no_sky===undefined?"–":N(g.no_sky)}</td><td class="n">${N(g.sun.jun)} / ${N(g.sun.aug)}</td></tr>`;
  $("glass").innerHTML=`<div class="controls"><span>${esc(t("pCase"))}: ${esc(scName(sc))}</span></div><table><thead>${head}</thead><tbody>${PIPE.variants.map(v=>row(v.key+". "+L(v.name),v.glass[sc],v.key==="C"?"rec":"")).join("")}${PIPE.sensitivity.map(s=>row(L(s.name),s.glass[sc])).join("")}</tbody></table>`;}
function renderStair(){const s=PIPE.stair;
  $("stair").innerHTML=fill(t("stairText"),{run:D(s.straight_run_m),rise:D(s.rise),n:D(s.risers),r:D(s.riser_mm),g:D(s.going_mm),rg:D(s.two_r_plus_g_mm),p:D(s.pitch_deg),f:D(s.flight_m),w:D(s.width_m),st:D(s.store_m2)});}
function renderWater(){const w=V("C").water;
  $("water").innerHTML=fill(t("waterText"),{mmh:D(w.storm_mm_h),day:D(w.day_mm),snow:D(w.snow_cm),op:D(w.opening_m2),cat:D(w.catchment_m2),sh:D(w.storm_m3_h),ls:D(w.storm_l_s),dm:D(w.day_m3),sw:D(w.snow_water_m3),stor:D(w.storage_m3),pump:D(w.pump_l_s)});}
function renderAdopt(){$("adopt").innerHTML=`<table><thead><tr><th>${esc(t("thItem"))}</th><th>${esc(t("thGeom"))}</th></tr></thead><tbody>${PIPE.adopt.map(a=>`<tr><td><b>${esc(L(a.item))}</b></td><td>${esc(L(a.geom))}</td></tr>`).join("")}</tbody></table>`;}

/* ---------- Page ---------- */
function applyStatic(){document.documentElement.lang=LANG;document.documentElement.dir=LANG==="fa"?"rtl":"ltr";document.title=t("title");
  document.querySelectorAll("[data-t]").forEach(el=>{el.innerHTML=t(el.dataset.t);});
  document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===LANG));
  $("built").textContent=fill(t("built"),{d:D(PIPE.built)});}
function render(){applyStatic();renderNav();renderVariants();renderSun();renderBirch();renderSpecies();renderGlass();renderStair();renderWater();renderAdopt();}
function setLang(l){LANG=l;try{localStorage.setItem(LANG_KEY,l);}catch(e){}render();}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{if(b.dataset.lang!==LANG)setLang(b.dataset.lang);});
/* Exposed for test_court.py, which runs this page's script in node. Nothing here runs in normal use. */
if(typeof globalThis!=="undefined")globalThis.__court={render,sunSvg,state,setLang};
render();
</script>
