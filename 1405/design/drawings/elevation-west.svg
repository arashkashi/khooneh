rty wall</text><text class="tbf" x="1249.2" y="2620" font-size="26" text-anchor="start">نمای غربی: دیوار مشترک</text><text class="tbt" x="144" y="2670" font-size="14.5">Seen from the west, street on the left.</text><text class="tbt" x="144" y="2692" font-size="14.5">The party wall, blank: each piece of structure-1405.json (role party) from its &#x27;from&#x27; storey to its &#x27;to&#x27; storey.</text><text class="tbt" x="144" y="2714" font-size="14.5">Pieces stepped in for the separation gap (red hatch, a red line at the step): W-PW1-up 0.05 m from F3, W-PW2-up 0.05 m from F3, W-PW3-up 0.05 m from F3.</text><text class="tbt" x="144" y="2736" font-size="14.5">Above the party wall: the roof parapet and coping (details-1405.json) and the stair house (the SH level).</text><text class="tbt" x="144" y="2758" font-size="14.5">The storeys&#x27; outline dashed; below ground the retaining walls dashed.</text><text class="tbt" x="144" y="2780" font-size="14.5">From the plan data through the pipeline (pages/permit_drawings.py). The AI&#x27;s proposal: no engineer or architect has checked it.</text><text class="tbt" x="1297.2" y="2580" font-size="18">Sheet · permit set</text><text class="tbt" x="1297.2" y="2640" font-size="54" font-weight="700">A-304</text><text class="tbt" x="1297.2" y="2695" font-size="18">Scale 1:100 on A2 (420 × 594 mm)</text><text class="tbt" x="1297.2" y="2725" font-size="18">Levels in m from ±0.00, the ground floor</text><text class="tbt" x="1297.2" y="2755" font-size="18">Drawn by: AI, from the pipeline</text></svg>
