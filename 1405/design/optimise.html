<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khooneh design tuning</title>
<style>
/* Look carried over from daylight.template.html and refine.template.html, with a dark set added. */
:root{color-scheme:light;--bg:#F6F5F0;--ink:#171D1C;--muted:#58635F;--line:#D6D8D1;--card:#fff;--accent:#16736F;--accent-soft:#E2F0EE;--warn:#9A5B13;--warn-soft:#FBF1E2;--sun:#E3A72F;--sun-soft:#FBF0D3;--plan:#FCFCFA;
  --surface:#fcfcfb;--grid:#E4E5DF;--axis:#8A928E;--cloud:#B9BDB6;--front:#2a78d6;--pick:#eb6834;--soil:#C9B98F;--green:#9CC59A;--stair:#D9D6CC;--glass:#6FA9D6;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])){color-scheme:dark;--bg:#151817;--ink:#ECEDE8;--muted:#A9B1AC;--line:#343A37;--card:#1C201F;--accent:#5CC0B8;--accent-soft:#1E3533;--warn:#E3A55A;--warn-soft:#33281A;--sun:#E3A72F;--sun-soft:#3A3019;--plan:#1a1a19;
  --surface:#1a1a19;--grid:#2C312F;--axis:#7C8581;--cloud:#4B524E;--front:#3987e5;--pick:#d95926;--soil:#6E6243;--green:#3F6B43;--stair:#3A3D38;--glass:#4B86B5}}
:root[data-theme=dark]{color-scheme:dark;--bg:#151817;--ink:#ECEDE8;--muted:#A9B1AC;--line:#343A37;--card:#1C201F;--accent:#5CC0B8;--accent-soft:#1E3533;--warn:#E3A55A;--warn-soft:#33281A;--sun:#E3A72F;--sun-soft:#3A3019;--plan:#1a1a19;
  --surface:#1a1a19;--grid:#2C312F;--axis:#7C8581;--cloud:#4B524E;--front:#3987e5;--pick:#d95926;--soil:#6E6243;--green:#3F6B43;--stair:#3A3D38;--glass:#4B86B5}
html[lang=fa]{--font:"Vazirmatn","Vazir",Tahoma,"Geeza Pro","Segoe UI",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 var(--font);overflow-x:clip}
html[lang=fa] body{line-height:1.8}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;max-width:1240px;margin:auto;padding:0 16px}
nav{display:flex;flex-wrap:wrap;gap:2px 4px;padding:8px 0;flex:1;min-width:0}
nav a{white-space:nowrap;text-decoration:none;color:var(--muted);font-size:13.5px;padding:4px 9px;border-radius:6px}
nav a:hover{background:var(--accent-soft);color:var(--accent)}
.lang{display:flex;align-items:center;gap:2px;flex:none;font-size:13px;color:var(--line)}
html[dir=rtl] .lang{order:-1}
.lang button{border:0;background:none;padding:3px 6px;font-size:13px;color:var(--muted);border-radius:5px;cursor:pointer}
.lang button.on{color:var(--accent);font-weight:700;background:var(--accent-soft)}
main{max-width:1240px;margin:auto;padding:22px 16px 80px}
h1{font-size:27px;margin:0 0 6px}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:15.5px;margin:16px 0 4px}
p{margin:6px 0}
.lede{color:var(--muted);max-width:820px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:18px;scroll-margin-top:70px;min-width:0}
section>.sub{color:var(--muted);margin-bottom:10px;max-width:820px}
.small{font-size:12.5px;color:var(--muted)}
button{font:inherit;font-size:13.5px;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
.notice{background:var(--warn-soft);border-radius:8px;padding:9px 12px;font-size:14.5px;margin:10px 0;max-width:900px}
.find{list-style:none;margin:6px 0;padding:0;font-size:14.5px}
.find li{padding-block:3px;padding-inline-start:10px;border-inline-start:3px solid var(--sun);margin:7px 0;max-width:900px}
.find.as li{border-color:var(--line)}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-size:13.5px;width:100%;margin:6px 0}
th,td{padding:4px 7px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12.5px}
td.n,th.n{text-align:end;white-space:nowrap}
td.chg{background:var(--sun-soft)}
td .k,th .k{color:var(--muted);font-size:11.5px;display:block;font-weight:400}
a{color:var(--accent)}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:8px}
.charts figure{margin:0;min-width:0}
.charts figcaption{font-size:13.5px;font-weight:600;margin-bottom:2px}
svg.chart{display:block;width:100%;height:auto;direction:ltr;background:var(--surface);border:1px solid var(--line);border-radius:8px}
svg.chart text{font-family:var(--font);fill:var(--muted);font-size:11px}
svg.chart text.lab{fill:var(--ink);font-size:11.5px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted);margin:8px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{flex:none}
.versions{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:8px}
.versions figure{margin:0;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--plan);min-width:0}
.versions figcaption{font-size:13px;margin-top:4px}
.versions figcaption b{display:block;font-size:14px}
svg.plan{display:block;width:100%;height:auto;direction:ltr}
svg.plan text{font-family:var(--font);font-size:7px;fill:var(--muted)}
.tip{position:fixed;z-index:9;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12.5px;line-height:1.45;box-shadow:0 2px 8px rgba(0,0,0,.18);max-width:280px}
.method p,.method li{max-width:860px;font-size:14.5px}
code{font-size:12.5px;background:var(--accent-soft);padding:0 4px;border-radius:4px;direction:ltr;unicode-bidi:embed}
@media(max-width:860px){nav{flex-wrap:nowrap;overflow-x:auto}}
@media(max-width:560px){section{padding:12px 10px}main{padding:14px 8px 60px}h1{font-size:23px}th,td{padding:3px 4px}}
</style>
</head>

"key":"f1","level":"ai-first","shades":"ai-basement","en":"First floor","fa":"طبقهٔ اول","below_en":"Basement: Shared room with the hoz","below_fa":"زیرزمین: اتاق مشترک با حوض"},{"key":"f2","level":"ai-second","shades":"ai-first","en":"Second floor","fa":"طبقهٔ دوم","below_en":"First floor: Living and dining","below_fa":"طبقهٔ اول: نشیمن و ناهارخوری"},{"key":"f3","level":"ai-third","shades":"ai-second","en":"Third floor","fa":"طبقهٔ سوم","below_en":"Second floor: Living and dining","below_fa":"طبقهٔ دوم: نشیمن و ناهارخوری"},{"key":"f4","level":"ai-fourth","shades":"ai-third","en":"Fourth floor","fa":"طبقهٔ چهارم","below_en":"Third floor: Bedroom","below_fa":"طبقهٔ سوم: اتاق خواب یک‌نفره"}],"key":"balcony"},"findings":{"court":[{"en":"In the likely case, the court's size and shape barely change the sun. Across the good versions the tree's crown gets 1.8–1.9 hours of sun a day and the floor about 0.8 hours. The rear building decides the sun, not the court. Only the shared room's sky moves, from a very low 0.8–1.5%, and only with a glazed bay.","fa":"در حالت محتمل، اندازه و شکل گودال تقریباً آفتابش را تغییر نمی‌دهد. در نسخه‌های خوب، تاج درخت ۱٫۸ تا ۱٫۹ ساعت و کف حدود ۰٫۸ ساعت آفتاب در روز می‌گیرد. آفتاب را ساختمان پشتی تعیین می‌کند، نه گودال. فقط آسمانِ اتاق مشترک، از رقم بسیار کمِ ۰٫۸ تا ۱٫۵٪، و فقط با جلوآمدگی شیشه‌ای تغییر می‌کند."},{"en":"The tree in the court study's plan stands 1.7 m from the balconies' edge. The chosen tree (silver birch, upright form) spreads up to 4.0 m, so it needs 2.0 m, and every pick moves it 0.30 m further back.","fa":"درخت در پلان بررسی گودال ۱٫۷ متر از لبهٔ بالکن‌ها فاصله دارد. درخت انتخاب‌شده (توس، فرم ستونی) تا ۴٫۰ متر پهن می‌شود، پس ۲٫۰ متر لازم دارد و همهٔ برگزیده‌ها آن را ۰٫۳۰ متر عقب‌تر می‌برند."},{"en":"So the court can be smaller. Version A is 6.20 × 5.10 m and keeps 10.9 m² more of the yard at ground level, with the same sun within the tolerance. Its floor is 30.1 m² instead of 41.5.","fa":"پس گودال می‌تواند کوچک‌تر باشد. نسخهٔ A با اندازهٔ ۶٫۲۰ × ۵٫۱۰ متر، ۱۰٫۹ متر مربع بیشتر از حیاط را در تراز همکف نگه می‌دارد و آفتابش در حد خطا همان است. کفش ۳۰٫۱ متر مربع است به‌جای ۴۱٫۵."},{"en":"What stops it getting smaller: the 4.5 m minimum, the caretaker's bedroom window, the tree's distance from the basement wall. Change one of those and the court could shrink further; a smaller court is a judgement for you, not for the numbers.","fa":"آنچه نمی‌گذارد کوچک‌تر شود: کمینهٔ ۴٫۵ متر، پنجرهٔ اتاق خواب سرایدار، فاصلهٔ درخت از دیوار زیرزمین. اگر یکی از این‌ها تغییر کند گودال می‌تواند کوچک‌تر شود؛ گودال کوچک‌تر تصمیم شماست، نه عددها."},{"en":"In this case the planted ledge buys nothing, so every pick leaves it out.","fa":"در این حالت سکوی کاشت سودی ندارد، پس هیچ برگزیده‌ای آن را ندارد."},{"en":"If the rear building stands 12 m away, a real choice appears. Stepping the shared room's glass 0.90 m out into the court as a glazed bay raises the sky it sees from 3.7% to 7.2%, at the cost of 2.3 m² of court floor. With the rear building on our line the same move only takes it from 0.8% to 1.5%, still dim.","fa":"اگر ساختمان پشتی ۱۲ متر دورتر باشد، انتخاب واقعی پیدا می‌شود. جلو آوردن شیشهٔ اتاق مشترک به اندازهٔ ۰٫۹۰ متر در گودال، به‌صورت جلوآمدگی شیشه‌ای، آسمانِ دیده‌شده را از ۳٫۷٪ به ۷٫۲٪ می‌رساند و ۲٫۳ متر مربع از کف گودال را می‌گیرد. با ساختمان پشتی روی مرز ما، همین کار فقط آن را از ۰٫۸٪ به ۱٫۵٪ می‌رساند که هنوز کم‌نور است."}],"balcony":[{"en":"In the likely case, the balconies on the first and second floors can go to the full 2.0 m. The rooms below them get at most 0.5 hours of December sun anyway, because the rear building blocks the low winter sun. A deeper balcony there costs no winter sun and cuts summer sun.","fa":"در حالت محتمل، بالکن‌های طبقهٔ اول و طبقهٔ دوم می‌توانند تا ۲٫۰ متر کامل عمیق شوند. اتاق‌های زیرشان به هر حال حداکثر ۰٫۵ ساعت آفتاب دی دارند، چون ساختمان پشتی آفتاب کم‌ارتفاع زمستان را می‌گیرد. بالکن عمیق‌تر آن‌جا هیچ آفتاب زمستانی نمی‌گیرد و آفتاب تابستان را کم می‌کند."},{"en":"The real trade-off is on the upper floors, above the big family's bedrooms and the second household's living room. The sunniest winter pick has winter sun of 0.16 kWh/m² against 0.09 now, but summer sun of 0.55 against 0.30. The coolest pick has 0.30 in summer and 0.09 in winter.","fa":"سازش واقعی در طبقه‌های بالاست، بالای خواب‌های خانوادهٔ بزرگ و نشیمن خانوار دوم. آفتابی‌ترین برگزیدهٔ زمستانی ۰٫۱۶ کیلووات‌ساعت بر متر مربع آفتاب زمستان دارد در برابر ۰٫۰۹ در حال حاضر، اما آفتاب تابستانش ۰٫۵۵ است در برابر ۰٫۳۰. خنک‌ترین برگزیده ۰٫۳۰ در تابستان و ۰٫۰۹ در زمستان دارد."},{"en":"Every pick also differs floor by floor. Whether unequal balconies look right on the yard side is for you and the drawings, not the numbers. All of these are within a small range: winter sun on these windows is low in every version.","fa":"هر برگزیده طبقه به طبقه هم فرق دارد. این‌که بالکن‌های نابرابر از سمت حیاط درست به نظر برسند، تصمیم شما و نقشه‌هاست، نه عددها. همهٔ این‌ها در بازهٔ کوچکی‌اند: آفتاب زمستان روی این پنجره‌ها در هر نسخه کم است."}]},"commits":{"court":"1846fd7","court12":"1846fd7","balcony":"1846fd7","now":"bb45b83"},"commands":["python3 studies/optimise/court_problem.py","python3 studies/optimise/court_problem.py --scenario rear12","python3 studies/optimise/balcony_problem.py","python3 studies/optimise/balcony_problem.py --scenario rear12","python3 studies/optimise/build_page.py"],"tree":{"key":"birch-fastigiata","name":{"en":"Silver birch, upright form","fa":"توس، فرم ستونی"},"spread_m":[2.5,4],"crown_r":2.0},"built":"2026-11-19"};

title:["Design tuning: a few good versions to choose from","تنظیم طرح: چند نسخهٔ خوب برای انتخاب"],
lede:["The AI takes a design that already works and asks whether a few of its dimensions are worth changing, within limits. First it checks, quickly and coarsely, whether any change would make a difference you would notice. Only if one would does it tune those dimensions, briefly, and show a few good versions side by side. The tool tunes. It never invents a new layout.","هوش مصنوعی طرحی را که از پیش کار می‌کند برمی‌دارد و می‌پرسد آیا ارزش دارد چند اندازه‌اش، در حدودی، تغییر کند. اول به‌سرعت و درشت بررسی می‌کند که آیا تغییری تفاوتی می‌سازد که متوجهش شوید. فقط اگر چنین باشد، همان اندازه‌ها را کوتاه تنظیم می‌کند و چند نسخهٔ خوب را کنار هم نشان می‌دهد. این ابزار تنظیم می‌کند. هرگز چیدمان تازه‌ای نمی‌سازد."],

lim1:["Coarse first. Pre-check: each dimension at its two buildable extremes, the others as drawn (2n+1 versions). If no measured goal moves beyond its meaningful threshold, the study stops. Screen: one dimension at a time at five levels (an end that can't be built is stepped inward), plus a small Latin hypercube, about 50 versions. For each dimension and goal it gives the spread, the high-minus-low effect and a straight-line fit over the buildable versions. Dimensions that move no measured goal beyond its threshold are dropped and stay as drawn. Areas are plain arithmetic and never a reason to search on their own. Short tuning on what is left: a grid for one or two dimensions, else a small NSGA-II genetic search (about 240 versions) with Deb's rule for constraints. Picks are merged and tidied on the meaningful thresholds. Iteration 3, below, used the earlier long search over every dimension.","اول درشت. پیش‌بررسی: هر اندازه در دو انتهای ساختنی‌اش، بقیه همان‌طور که کشیده شده (2n+1 نسخه). اگر هیچ هدفِ سنجیده‌ای بیش از حد معنادارش تغییر نکند، بررسی می‌ایستد. غربال: هر بار یک اندازه در پنج مقدار (انتهایی که ساختنی نیست به سمت داخل جابه‌جا می‌شود)، به‌همراه یک نمونهٔ کوچک لاتین، حدود ۵۰ نسخه. برای هر اندازه و هدف، دامنهٔ تغییر، اثر بالا منهای پایین و یک برازش خطی روی نسخه‌های ساختنی را می‌دهد. اندازه‌هایی که هیچ هدف سنجیده‌ای را بیش از حدش تغییر نمی‌دهند کنار گذاشته می‌شوند و همان‌طور که کشیده شده می‌مانند. مساحت‌ها حساب ساده‌اند و به‌تنهایی دلیل جست‌وجو نیستند. تنظیم کوتاه روی باقی‌مانده: برای یک یا دو اندازه یک شبکه، وگرنه یک جست‌وجوی ژنتیکی کوچک NSGA-II (حدود ۲۴۰ نسخه) با قاعدهٔ Deb برای قیدها. برگزیده‌ها با حدهای معنادار ادغام و مرتب می‌شوند. دور سوم، در پایین، با جست‌وجوی طولانیِ قبلی روی همهٔ اندازه‌ها انجام شد."],

const t=k=>{const e=I18N[k];return e?e[LANG==="fa"?1:0]:k;};
const L=o=>o==null?"":typeof o==="object"?(o[LANG]||o.en||""):String(o);
const FA="۰۱۲۳۴۵۶۷۸۹";
const D=s=>LANG==="fa"?String(s).replace(/[0-9]/g,d=>FA[d]).replace(/\./g,"٫").replace(/-/g,"−"):String(s).replace(/-/g,"−");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d)=>D(Number(v).toFixed(d));
const unitL=u=>LANG==="fa"?({"h/day":"ساعت در روز","%":"٪","m²":"متر مربع","kWh/m²":"کیلووات‌ساعت بر متر مربع","m":"متر"}[u]||u):u;
const LETTERS="ABCDEFG";

// ---- Problems as the page shows them ------------------------------------------------
function varVal(P,v,x){const val=x[v.key];return P.key==="balcony"?val*0.05:val;}
function varText(P,v,x){return fmt(varVal(P,v,x),2)+" "+unitL("m");}
function objLabel(o){return L({en:o.en,fa:o.fa});}
function oval(o,v){return fmt(v,o.digits);}
function roleText(roles,P){return roles.map(r=>r==="working design"?t("r_working"):r==="buildable start"?t("r_start"):r==="balanced"?t("r_balanced"):r==="spread"?t("r_spread"):r.startsWith("without:")?t("r_without")+L((P.problem.variables.find(v=>v.key===r.slice(8))||{en:r,fa:r})).split("(")[0].trim().toLowerCase():r.startsWith("best:")?t("r_best")+objLabel(P.problem.objectives.find(o=>o.key===r.slice(5))).toLowerCase():r).filter((r,i,a)=>a.indexOf(r)===i).join(LANG==="fa"?"، ":", ");}
function versionName(i){return i===0?t("nowCol"):LETTERS[i-1];}

function reading(P,i){
  const main=P.params.scenario,now=P.picks[0].full[main].objectives,v=P.picks[i].full[main].objectives;
  if(i===0)return LANG==="fa"?"نقطهٔ شروع.":"The starting point.";
  const better=[],worse=[];
  for(const o of P.problem.objectives){const d=v[o.key]-now[o.key];if(Math.abs(d)<=(P.precheck?P.precheck.thresholds[o.key].value:o.tol)*(P.precheck?0.999:1))continue;
    const good=o.sense==="max"?d>0:d<0;const txt=objLabel(o).toLowerCase()+" "+oval(o,v[o.key])+" "+unitL(o.unit)+" ("+t("nowWord")+" "+oval(o,now[o.key])+")";(good?better:worse).push(txt);}
  const sep=LANG==="fa"?"، ":", ";
  const ch=P.problem.variables.filter(w=>Math.abs(varVal(P,w,P.picks[i].x)-varVal(P,w,P.picks[0].x))>1e-6).map(w=>L({en:w.en,fa:w.fa}).split("(")[0].trim()+" "+fmt(varVal(P,w,P.picks[i].x),2));
  let s=(ch.length?ch.join(sep)+". ":"");
  if(!better.length&&!worse.length)return s+t("sameAll");
  if(better.length)s+=t("gains")+better.join(sep)+". ";
  if(worse.length)s+=t("gives")+worse.join(sep)+". ";
  return s+t("restSame");
}

function legend(){const dot=(c,r,ring)=>`<svg width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="${r}" fill="${ring?"none":c}" stroke="${ring?"var(--ink)":"var(--surface)"}" stroke-width="${ring?2:1.5}"/></svg>`;
  return `<div class="legend"><span>${dot("var(--cloud)",3)}${t("legCloud")}</span><span>${dot("var(--front)",4.5)}${t("legFront")}</span><span>${dot("var(--pick)",6)}${t("legPick")}</span><span>${dot("",6,true)}${t("legNow")}</span></div>`;}
function nice(lo,hi){if(hi-lo<1e-9){lo-=0.5;hi+=0.5;}const span=hi-lo,step=Math.pow(10,Math.floor(Math.log10(span/4)));const m=[1,2,2.5,5,10].find(k=>span/(k*step)<=6)*step;return{lo:Math.floor(lo/m)*m,hi:Math.ceil(hi/m)*m,step:m};}
let TIPS=[];
function chart(P,xk,yk,id){
  const O=P.problem.objectives,xi=O.findIndex(o=>o.key===xk),yi=O.findIndex(o=>o.key===yk),xo=O[xi],yo=O[yi];
  const pts=P.cloud,front=P.front.map(e=>[e.objectives[xk],e.objectives[yk]]),picks=P.picks.map(p=>[p.search.objectives[xk],p.search.objectives[yk]]);

  const W=360,H=250,ml=46,mr=14,mt=14,mb=40;const X=nice(Math.min(...xs),Math.max(...xs)),Y=nice(Math.min(...ys),Math.max(...ys));
  const sx=v=>ml+(v-X.lo)/(X.hi-X.lo)*(W-ml-mr),sy=v=>H-mb-(v-Y.lo)/(Y.hi-Y.lo)*(H-mt-mb);

  for(let v=X.lo;v<=X.hi+1e-9;v+=X.step){g+=`<text x="${sx(v)}" y="${H-mb+14}" text-anchor="middle">${D(+v.toFixed(3))}</text>`;}
  g+=`<line x1="${ml}" x2="${W-mr}" y1="${H-mb}" y2="${H-mb}" stroke="var(--axis)"/>`;
  const xh=(xo.sense==="min"?"← ":"")+objLabel(xo)+", "+unitL(xo.unit)+(xo.sense==="max"?" →":"");
  g+=`<text x="${(ml+W-mr)/2}" y="${H-8}" text-anchor="middle">${esc(xh)} <tspan font-size="9.5">(${t("better")} ${xo.sense==="min"?"←":"→"})</tspan></text>`;
  g+=`<text transform="translate(11 ${(mt+H-mb)/2}) rotate(-90)" text-anchor="middle">${esc(unitL(yo.unit))} (${t("better")} ${yo.sense==="max"?"↑":"↓"})</text>`;
  for(const p of pts)g+=`<circle cx="${sx(p[xi]).toFixed(1)}" cy="${sy(p[yi]).toFixed(1)}" r="2.5" fill="var(--cloud)" opacity=".75"/>`;
  front.forEach((p,i)=>{g+=`<circle cx="${sx(p[0]).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="4.5" fill="var(--front)" stroke="var(--surface)" stroke-width="1.5" data-tip="${id}|f|${i}"/>`;});
  const placed=[];const cands=[[9,-7],[9,13],[-19,-7],[-19,13],[9,25],[-19,25],[9,-19],[-19,-19],[-48,-7],[-48,13],[30,-7],[30,13],[9,37],[-48,25],[-48,-19],[9,-31]];
  picks.forEach((p,i)=>{const cx=sx(p[0]),cy=sy(p[1]);
    g+=i===0?`<circle cx="${cx}" cy="${cy}" r="6.5" fill="none" stroke="var(--ink)" stroke-width="2" data-tip="${id}|p|${i}"/>`:`<circle cx="${cx}" cy="${cy}" r="6.5" fill="var(--pick)" stroke="var(--surface)" stroke-width="2" data-tip="${id}|p|${i}"/>`;
    // Each label takes the first nearby spot that is inside the plot and clear of the labels already placed.
    const w=versionName(i).length*7+2;let pos=null;
    for(const [dx0,dy] of cands){const dx=dx0<0?dx0-w+14:dx0,x=cx+dx,y=cy+dy;if(x<ml||x+w>W-mr||y<mt+9||y>H-mb-2)continue;
      if(placed.every(q=>Math.abs(q[0]-x)>=Math.max(q[2],w)+1||Math.abs(q[1]-y)>=12)){pos=[x,y];break;}}
    if(!pos){let best=-1;for(const [dx0,dy] of cands){const dx=dx0<0?dx0-w+14:dx0,x=Math.min(Math.max(cx+dx,ml),W-mr-w),y=Math.min(Math.max(cy+dy,mt+9),H-mb-2);
      const gap=Math.min(99,...placed.map(q=>Math.max(Math.abs(q[0]-x)-Math.max(q[2],w),Math.abs(q[1]-y)-12)));if(gap>best){best=gap;pos=[x,y];}}}
    placed.push([pos[0],pos[1],w]);

}

    h+=`<td class="n">${fmt(varVal(P,v,{[v.key]:cov[v.key][0]}),2)} – ${fmt(varVal(P,v,{[v.key]:cov[v.key][1]}),2)}</td>`;
    if(d)h+=`<td>${d.kept?"<b>"+t("kept")+"</b>":t("dropped")+": "+t(d.why)}</td>`;h+=`</tr>`;}
  return h+`</tbody></table></div>`;}
function screenBlock(P,id){const O=P.problem.objectives;
  const leg=`<div class="legend"><span><svg width="16" height="10"><rect width="16" height="10" rx="2" fill="var(--front)"/></svg>${t("legMatters")}</span><span><svg width="16" height="10"><rect width="16" height="10" rx="2" fill="var(--axis)"/></svg>${t("legNot")}</span><span><svg width="16" height="10"><line x1="8" x2="8" y1="0" y2="10" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 2"/></svg>${t("legThr")}</span></div>`;
  return `<h3>${P.screen?t("scTitle"):t("scTitlePc")}</h3><p class="small">${t("scSub")}</p>${leg}<div class="charts">${O.map((o,k)=>effectChart(P,o,id+"e"+k)).join("")}</div>
  <p><button type="button" data-table="${id}e">${t("showTable")}</button></p><div id="tbl-${id}e" hidden>${effectTable(P)}</div>`;}
function timesLine(P){const s=v=>D(Number(v||0).toFixed(1))+t("sec");
  return `<p class="small">${t("times")}${t("tPc")} ${s(P.seconds_precheck)} · ${t("tSc")} ${s(P.seconds_screen)} · ${t("tRf")} ${s(P.seconds_refine)} · ${t("tRm")} ${s(P.seconds_report)}. ${t("run")}${D(P.measured)}${t("versionsWord").replace(".","")}, ${D(P.feasible)}${t("buildableW")}.</p>`;}
function nowStudy(P){const isCourt=P.key==="court",sc=P.params.scenario,id=P.id.replace(/[^a-z0-9]/g,"");
  let h=`<section id="${P.id}"><h2>${t("st_"+P.key)} · ${t("sc_"+sc)}</h2>${findings(P.findings)}${precheckTable(P)}${screenBlock(P,id)}`;
  if(P.stop){h+=`<h3>${t("stopTitle")}</h3><div class="notice">${esc(L(P.message))}</div><p class="small">${t("drawnNums")}</p>`;}
  else{h+=`<h3>${t("rfTitle")}</h3>`;}
  h+=picksTable(P,isCourt?courtSketch:balSketch,isCourt?courtKey():"").replace(`<h3>${t("picked")}</h3>`,"").replace(t("mainCase"),t("sc_"+sc));
  return h+timesLine(P)+`</section>`;}

function render(){
  TIPS=[];const C=DATA.court,C12=DATA.court12,B=DATA.balcony;
  document.getElementById("nav").innerHTML=[["now","navNow"],["old","navOld"],["limits","navLimits"],["method","navMethod"]].map(([id,k])=>`<a href="#${id}">${t(k)}</a>`).join("");
  let h=`<h1>${t("title")}</h1><p class="lede">${t("lede")}</p><p class="small">${t("links")} <a href="design-1405.html">${t("refine")}</a> · <a href="daylight.html">${t("daylight")}</a></p>`;
  h+=`<section id="now"><h2>${t("nowTitle")}</h2><p class="sub">${t("nowSub")}</p><ul class="find as"><li>${t("nowHow")}</li><li>${t("how1")}</li><li>${t("how4")}</li></ul></section>`;
  h+=DATA.now.map(nowStudy).join("");
  h+=`<section id="old"><h2>${t("oldTitle")}</h2><p class="sub">${t("oldSub")}</p><p><button type="button" id="oldBtn">${t("showOld")}</button></p><div id="oldBody" hidden>`;
  h+=`<section id="how"><h2>${t("how")}</h2><ul class="find as"><li>${t("how1")}</li><li>${t("how2")}</li><li>${t("how3")}</li><li>${t("how4")}</li></ul></section>`;
  h+=`<section id="court"><h2>${t("courtTitle")}</h2><p class="sub">${t("courtSub").replace("{tree}",esc(L(DATA.tree.name)).toLowerCase()).replace("{spread}",fmt(DATA.tree.spread_m[1],1))}</p><h3>${t("courtFind")}</h3>${findings(DATA.findings.court)}${problemSection(C)}${diagNote(C)}${chartsBlock(C,"c6","yard_lost")}${picksTable(C,courtSketch,courtKey())}
    <h3 style="margin-top:26px">${t("court12Title")}</h3><p class="sub">${t("court12Sub")}</p>${diagNote(C12)}${chartsBlock(C12,"c12","yard_lost")}${picksTable(C12,courtSketch,courtKey())}</section>`;
  h+=`<section id="balconies"><h2>${t("balTitle")}</h2><p class="sub">${t("balSub")}</p><h3>${t("balFind")}</h3>${findings(DATA.findings.balcony)}${problemSection(B)}${diagNote(B)}${chartsBlock(B,"b","area")}${picksTable(B,balSketch,"")}</section></div></section>`;
  h+=`<section id="limits"><h2>${t("limits")}</h2><p class="sub">${t("limitsSub")}</p><ul class="find as">${["lim1","lim2","lim3","lim4","lim5","lim6"].map(k=>`<li>${t(k)}</li>`).join("")}</ul></section>`;
  h+=`<section id="method" class="method"><h2>${t("method")}</h2><p>${t("m1")}</p><p>${t("m2")}</p><p>${t("m3")}${DATA.commands.map(c=>`<code>${esc(c)}</code>`).join(" · ")}</p><p class="small">${t("built")}${D(DATA.built)}</p></section>`;
  document.getElementById("main").innerHTML=h;
  document.getElementById("oldBtn").onclick=()=>{const el=document.getElementById("oldBody");el.hidden=!el.hidden;};
  document.querySelectorAll("[data-table]").forEach(b=>b.onclick=()=>{const el=document.getElementById("tbl-"+b.dataset.table);el.hidden=!el.hidden;b.textContent=el.hidden?t("showTable"):t("hideTable");});
}
function applyLang(){document.documentElement.lang=LANG;document.documentElement.dir=LANG==="fa"?"rtl":"ltr";document.title=t("title");
  document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===LANG));render();}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;try{localStorage.setItem(LANG_KEY,LANG);}catch(e){}applyLang();});
const tip=document.getElementById("tip");
function showTip(el,x,y){tip.innerHTML=tipHtml(el.dataset.tip);tip.hidden=false;const r=tip.getBoundingClientRect();tip.style.left=Math.max(4,Math.min(x+12,innerWidth-r.width-4))+"px";tip.style.top=Math.max(4,Math.min(y+12,innerHeight-r.height-4))+"px";}
document.addEventListener("mousemove",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)showTip(el,e.clientX,e.clientY);else tip.hidden=true;});
document.addEventListener("click",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)showTip(el,e.clientX,e.clientY);else tip.hidden=true;});
applyLang();
</script>
