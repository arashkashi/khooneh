's living room moves to F4's yard-east zone, the caretaker's living room moves to F2's street-west zone and the small duplex's living room moves to F3's yard-east zone. Sun 12.7 hours (iteration 4: 11.4); zones that could later change home 2 (1); risers changing home 4 (4).","<b>فضای باز برای بیشترین خانه‌ها (۴ از ۴، دور چهارم: ۳):<\/b> بخش حیاطی شرقی F۲ از دوبلکس کوچک به مهتابی سرپوشیدهٔ سرایدار می‌رسد، بخش خیابانی شرقی F۳ از خانوادهٔ بزرگ به دوبلکس کوچک می‌رسد، بی بالکن حیاطی در F۲ و F۴، بالکن حیاطی در F۳، نشیمن خانوادهٔ بزرگ به بخش حیاطی شرقی F۴ می‌رود، نشیمن سرایدار به بخش خیابانی غربی F۲ می‌رود و نشیمن دوبلکس کوچک به بخش حیاطی شرقی F۳ می‌رود. آفتاب ۱۲٫۷ ساعت (دور چهارم: ۱۱٫۴)؛ بخش‌هایی که بعداً می‌توانند خانه عوض کنند ۲ (۱)؛ رایزرهایی که خانه عوض می‌کنند ۴ (۴)."],["<b>Goals dropped before the search:<\/b> fairness: the worst-off home's sun; circulation: private stairs; circulation: private stair area. None can move by a step anyone would notice across the stacks the area bands allow.","<b>هدف‌هایی که پیش از جست‌وجو کنار گذاشته شدند:<\/b> انصاف: آفتاب کم‌بهره‌ترین خانه؛ گردش: پله‌های اختصاصی؛ گردش: مساحت پلهٔ اختصاصی. هیچ‌کدام در چیدمان‌هایی که محدودهٔ متراژها اجازه می‌دهد آن‌قدر تکان نمی‌خورد که کسی متوجه شود."],["<b>If the rear building stands 12 m away,<\/b> iteration 4's living rooms get 19.0 hours, and the sunniest stack is the same one (21.7 hours).","<b>اگر ساختمان پشتی ۱۲ متر دورتر باشد،<\/b> نشیمن‌های دور چهارم ۱۹٫۰ ساعت آفتاب می‌گیرند، و آفتابی‌ترین چیدمان همان است (۲۱٫۷ ساعت)."],["<b>Is it meaningful?<\/b> For the small duplex, yes: 2.3 more hours of December sun is a room you notice. Whether it is worth the changes above is the owner's call.","<b>آیا معنادار است؟<\/b> برای دوبلکس کوچک، بله: ۲٫۳ ساعت آفتاب دی بیشتر چیزی است که در اتاق حس می‌شود. این‌که به تغییرهای بالا می‌ارزد با صاحب‌کار است."]],"homes":{"A":["the one-level home (A)","خانهٔ یک‌طبقه (A)"],"C":["the caretaker (C)","سرایدار (C)"],"D":["the small duplex (D)","دوبلکس کوچک (D)"],"B":["the const params=new URLSearchParams(location.search);

function initialLang(){const q=params.get("lang");if(q==="fa"||q==="en")return q;try{const s=localStorage.getItem(LANG_KEY);if(s==="fa"||s==="en")return s;}catch(e){}return String(navigator.language||"").toLowerCase().startsWith("fa")?"fa":"en";}
let LANG=initialLang();
const FA_DIG="۰۱۲۳۴۵۶۷۸۹";
const faDigits=s=>String(s).replace(/(\d)\.(\d)/g,"$1٫$2").replace(/\d/g,d=>FA_DIG[d]);
const D=x=>LANG==="fa"?faDigits(x):String(x);
const t=k=>{const e=I18N[k];return e?e[LANG==="fa"?1:0]:k;};
const P=pair=>pair?pair[LANG==="fa"?1:0]:"";
const f1=v=>D(Number(v).toFixed(1));
const INT=new Set(["wishes_met","riser_changes","homes_with_outdoor","swing_zones","private_stairs","floors_without_riser"]);
const fv=(k,v)=>INT.has(k)?D(Math.round(v)):f1(v);
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]!==undefined?o[k]:"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FLOORS=["F1","F2","F3","F4"],HOMES=["A","C","D","B"];
const homeOf=u=>u?u.replace("*",""):null,isTerr=u=>!!u&&u.endsWith("*");
const zoneName=z=>{const [f,k]=z.split(".");const b={S:["street","خیابانی"],M:["middle","میانی"],Y:["yard","حیاطی"]}[k[0]],h={W:["west","غربی"],E:["east","شرقی"]}[k[1]];return LANG==="fa"?`${f} ${P(b)}ِ ${P(h)}`:`${f} ${P(b)}-${P(h)}`;};
const homeShort=h=>P(DATA.homes[h]);

function renderPre(){
  const p=DATA.patterns_ok.map(pt=>HOMES.map(h=>`${h} ${pt[h].join("+")}`).join(", ")).join("; ");
  document.getElementById("pre-floor").innerHTML=fmt(t("floorCheck"),{n:D(DATA.counts.patterns),k:D(DATA.patterns_ok.length),p:esc(p)});

  document.getElementById("pre").innerHTML=`<table><thead><tr><th>${t("thGoal")}</th><th>${t("thUnit")}</th><th class="n">${t("thRange")}</th><th class="n">${t("thStep")}</th><th>${t("thVerdict")}</th><th class="n">${t("thReal")}</th><th>${t("thWhy")}</th></tr></thead><tbody>${rows}</tbody></table>`;

function renderZones(){
  let h=`<table><thead><tr><th>${t("thZone")}</th><th class="n">${t("thArea")}</th><th>${t("thDoor")}</th><th>${t("thRiser")}</th><th class="n">${t("thDec")}</th><th class="n">${t("thJun")}</th><th class="n">${t("thSky")}</th></tr></thead><tbody>`;
  for(const f of [...FLOORS].reverse())for(const k of ["SW","SE","MW","ME","YW","YE"]){
    const id=`${f}.${k}`,z=DATA.zones[id],l=z.light;
    const two=(a,b)=>b===undefined?f1(a):`${f1(a)} / ${f1(b)}`;
    const cell=key=>!l?`<span class="small">${t("noWin")}</span>`:two(l.open[key],l.slab?l.slab[key]:undefined);
    h+=`<tr><td>${esc(zoneName(id))}</td><td class="n">${f1(z.area)}</td><td>${z.entry?t("yes"):""}</td><td>${esc(z.risers.join(", "))}</td><td class="n">${cell("dec")}</td><td class="n">${cell("jun")}</td><td class="n">${cell("sky")}</td></tr>`;}
  document.getElementById("zones").innerHTML=h+"</tbody></table>";

/* ---------- Section diagrams ---------- */
const DEPTH={S:7.0,M:2.1,Y:4.6},BAL=1.8;
function sectionSVG(c){
  const sx=14,rowH=30,gap=26,left=34,top=18;
  const stripW=(DEPTH.S+DEPTH.M+DEPTH.Y+BAL)*sx;
  const W=left+2*stripW+gap+8,H=top+4*rowH+rowH*0.6+30;
  let s=`<svg class="sec" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(P(c.title))}"><defs>`;
  for(const h of HOMES)s+=`<pattern id="hatch-${h}-${c.role}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--card)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--h${h})" stroke-width="2.5"/></pattern>`;
  s+=`</defs>`;
  ["W","E"].forEach((half,hi)=>{
    const x0=left+hi*(stripW+gap);
    s+=`<text x="${x0}" y="11" class="lab">${esc(t(half==="W"?"west":"east"))} · ${esc(t("street"))} ←  → ${esc(t("yard"))}</text>`;
    FLOORS.forEach((f,fi)=>{
      const y=top+(3-fi)*rowH;
      if(hi===0)s+=`<text x="4" y="${y+rowH/2+4}" class="lab">${f}</text>`;
      let x=x0;
      for(const b of ["S","M","Y"]){
        const w=DEPTH[b]*sx,id=`${f}.${b}${half}`,u=c.stack[id],h=homeOf(u),terr=isTerr(u);
        let zx=x,zw=w;
        if(b==="S"&&half==="E"){const cw=2.3*sx;s+=`<rect x="${x+w-cw}" y="${y+1}" width="${cw-1}" height="${rowH-2}" fill="var(--core)"/>`;if(fi===0)s+=`<text x="${x+w-cw+3}" y="${y+rowH-6}" class="lab" style="font-size:8.5px">${esc(t("core"))}</text>`;zw=w-cw;}
        const fill=terr?`url(#hatch-${h}-${c.role})`:`var(--h${h})`;
        s+=`<rect x="${zx+1}" y="${y+1}" width="${zw-2}" height="${rowH-2}" rx="3" fill="${fill}" fill-opacity="${terr?1:0.45}" stroke="var(--h${h})" stroke-width="1.5"><title>${esc(zoneName(id))}: ${esc(homeShort(h))}${terr?" · "+esc(t("terrace")):""}, ${f1(DATA.zones[id].area)} m²</title></rect>`;
        const liv=c.m.living[h]===id;
        const lab=h+(terr?" "+t("terrace"):"")+(liv?` ☀${f1(c.m.sun[h].dec)}`:"");
        if(zw>18)s+=`<text x="${zx+zw/2}" y="${y+rowH/2+4}" text-anchor="middle" style="font-weight:${liv?700:500}">${esc(LANG==="fa"?faDigits(lab):lab)}</text>`;
        x+=w;
      }
      if(half==="E"&&c.balconies.includes(f))s+=`<rect x="${x}" y="${y+rowH-4}" width="${BAL*sx-2}" height="4" fill="var(--h${homeOf(c.stack[f+".YE"])})"><title>${esc(t("kBalcony"))} ${f}</title></rect>`;
    });
    const yb=top+4*rowH;
    s+=`<rect x="${x0+1}" y="${yb+1}" width="${(DEPTH.S+DEPTH.M+DEPTH.Y)*sx-2}" height="${rowH*0.6-2}" rx="3" fill="var(--shared)"/>`;
    if(hi===0)s+=`<text x="${x0+4}" y="${yb+rowH*0.45}" class="lab" style="font-size:9.5px">${esc(t("shared"))}</text>`;
  });
  return s+"</svg>";
}
function outdoorText(c){
  const kinds={"balcony":"kBalcony","terrace":"kTerrace","street terrace":"kStreet"};
  return HOMES.map(h=>{const o=c.m.outdoor[h];return `${h}: ${o.length?o.map(x=>`${t(kinds[x.kind])} ${f1(x.dec)}h`).join(", "):"–"}`;}).join(" · ");

<div class="kv"><span>${t("sunH")}: <b>${HOMES.map(h=>`${h} ${f1(m.sun[h].dec)}`).join(" · ")}</b></span><span>${t("total")}: <b>${f1(m.sun_total)} h</b> · ${t("thSky")} <b>${f1(m.sky_mean)}</b></span></div>
<div class="small">${t("balc")}: ${esc(c.balconies.join(", ")||t("none"))} · ${t("changed")}: ${esc(c.changes.map(zoneName).join(", ")||t("none"))}</div>
<div class="small">${t("outdoorL")}: ${esc(outdoorText(c))}</div>
<div class="small">${t("unmet")}: ${esc(unmet.join(", ")||t("none"))} · ${t("noise")}: ${esc(noise.join(", ")||t("none"))}${m.living_up.length?` · ${t("up")}: ${esc(m.living_up.join(", "))}`:""}</div>
<div class="scroll"><table><caption class="small" style="text-align:start">${t("areasBy")}</caption><thead><tr><th></th>${FLOORS.map(f=>`<th class="n">${f}</th>`).join("")}<th class="n">${t("total")}</th><th class="n">${t("band")}</th></tr></thead><tbody>${areaRows}</tbody></table></div></div>`;}).join("");
}

const tip=document.getElementById("tip");
function showTip(ev,html){tip.innerHTML=html;tip.hidden=false;const x=Math.min(ev.clientX+14,innerWidth-290);tip.style.left=x+"px";tip.style.top=(ev.clientY+12)+"px";}
function hideTip(){tip.hidden=true;}
function axes(W,H,m,xr,yr,xt,yt,xl,yl){
  const X=v=>m.l+(v-xr[0])/(xr[1]-xr[0])*(W-m.l-m.r),Y=v=>H-m.b-(v-yr[0])/(yr[1]-yr[0])*(H-m.t-m.b);
  let s="";
  for(const v of yt)s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${D(v)}</text>`;
  for(const v of xt)s+=`<text x="${X(v)}" y="${H-m.b+16}" text-anchor="middle">${D(v)}</text>`;
  s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}" stroke="var(--axis)"/>`;
  s+=`<text x="${(m.l+W-m.r)/2}" y="${H-4}" text-anchor="middle">${esc(xl)}</text><text x="${m.l}" y="${m.t-8}">${esc(yl)}</text>`;
  return {X,Y,s};
}
function renderScatter(){
  const W=720,H=380,m={l:44,r:18,t:28,b:42};
  const pts=DATA.points;
  const xs=pts.map(p=>p.sun_total),ys=pts.map(p=>p.sky_mean);
  const xr=[Math.floor(Math.min(...xs))-0.5,Math.ceil(Math.max(...xs))+0.5],yr=[Math.floor(Math.min(...ys)/2)*2-2,Math.ceil(Math.max(...ys)/2)*2+2];
  const xt=[];for(let v=Math.ceil(xr[0]);v<=xr[1];v++)xt.push(v);const yt=[];for(let v=yr[0];v<=yr[1];v+=2)yt.push(v);
  const A=axes(W,H,m,xr,yr,xt,yt,t("xSun"),t("ySky"));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("hTrade"))}">${A.s}`;
  const order=[...pts].sort((a,b)=>a.front-b.front);
  for(const p of order)s+=`<circle cx="${A.X(p.sun_total)}" cy="${A.Y(p.sky_mean)}" r="${p.front?5:4}" fill="${p.front?"var(--front)":"var(--dot)"}" stroke="var(--card)" stroke-width="2"/>`;
  const base=DATA.cards[0];
  const marks=DATA.cards.map(c=>({c,x:A.X(c.m.sun_total),y:A.Y(c.m.sky_mean)}));
  const placed=[];
  for(const k of marks){
    const isBase=k.c.role==="baseline";
    s+=`<circle cx="${k.x}" cy="${k.y}" r="${isBase?7:8}" fill="none" stroke="${isBase?"var(--base)":"var(--ink)"}" stroke-width="2"/>`;
    let ly=k.y-12;while(placed.some(q=>Math.abs(q.x-k.x)<150&&Math.abs(q.y-ly)<13))ly-=13;placed.push({x:k.x,y:ly});
    const anchor=k.x>W-170?"end":"start";
    s+=`<text x="${k.x+(anchor==="end"?-10:10)}" y="${ly}" text-anchor="${anchor}" class="ink" style="font-weight:600">${esc(P(k.c.title))}</text>`;
  }
  for(const p of pts)s+=`<circle class="hit" data-i="${p.i}" cx="${A.X(p.sun_total)}" cy="${A.Y(p.sky_mean)}" r="12" fill="transparent"/>`;
  s+="</svg>";
  const el=document.getElementById("scatter");el.innerHTML=s;
  const byI={};pts.forEach(p=>byI[p.i]=p);
  el.querySelectorAll(".hit").forEach(c=>{c.onmousemove=ev=>{const p=byI[c.dataset.i];
    showTip(ev,`${t("xSun").split(/[,،]/)[0]}: <b>${f1(p.sun_total)} h</b><br>${t("ySky")}: <b>${f1(p.sky_mean)}</b><br>${P(DATA.goals.wishes_met)}: ${D(p.wishes_met)} · ${P(DATA.goals.homes_with_outdoor)}: ${D(p.homes_with_outdoor)}<br>${P(DATA.goals.swing_zones)}: ${D(p.swing_zones)} · ${P(DATA.goals.riser_changes)}: ${D(p.riser_changes)}${p.front?"<br><b>"+t("lgFront")+"</b>":""}`);};c.onmouseleave=hideTip;});
  document.getElementById("tr-legend").innerHTML=`<span><i class="dot" style="background:var(--dot)"></i>${t("lgOther")}</span><span><i class="dot" style="background:var(--front)"></i>${t("lgFront")}</span><span><i class="dot" style="border:2px solid var(--base)"></i>${t("lgBase")}</span><span><i class="dot" style="border:2px solid var(--ink)"></i>${t("lgPick")}</span>`;
}
const COLS=["sun_total","sky_mean","wishes_met","riser_changes","homes_with_outdoor","swing_zones","living_over_other"];
function colHead(k){return k==="living_over_other"?t("noise")+", m²":P(DATA.goals[k]);}
function renderPickTable(){
  const head=`<tr><th>${t("thStack")}</th>${COLS.map(k=>`<th class="n">${esc(colHead(k))}</th>`).join("")}<th>${t("balc")}</th></tr>`;
  const rows=DATA.cards.map(c=>`<tr><td>${esc(P(c.title))}</td>${COLS.map(k=>`<td class="n">${fv(k,c.m[k])}</td>`).join("")}<td>${esc(c.balconies.join(", "))}</td></tr>`).join("");
  document.getElementById("picktable").innerHTML=`<table><thead>${head}</thead><tbody>${rows}</tbody></table>`;
  const fh=`<tr><th>#</th>${COLS.map(k=>`<th class="n">${esc(colHead(k))}</th>`).join("")}<th>${t("balc")}</th><th>${t("changed")}</th></tr>`;
  const fr=DATA.front.map(f=>`<tr><td>${D(f.i)}</td>${COLS.map(k=>`<td class="n">${fv(k,f[k])}</td>`).join("")}<td>${esc(f.balconies.join(", "))}</td><td class="small">${esc(f.changes.map(zoneName).join(", ")||t("none"))}</td></tr>`).join("");
  document.getElementById("fronttable").innerHTML=`<table><thead>${fh}</thead><tbody>${fr}</tbody></table>`;
}

/* ---------- Balcony depth sweep ---------- */
function renderSweep(){
  const sw=DATA.refine.find(r=>r.floor==="F4").rows;
  const W=640,H=300,m={l:40,r:150,t:28,b:42};
  const A=axes(W,H,m,[0,1.8],[0,4],[0,0.3,0.6,0.9,1.2,1.5,1.8],[0,1,2,3,4],t("xDepth"),t("yDec"));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("hRefine"))}">${A.s}`;
  const series=[["F3.YW","sYW","var(--hB)"],["F3.YE","sYE","var(--hD)"]];
  for(const [z,k,col] of series){
    const d=sw.map((r,i)=>`${i?"L":"M"}${A.X(r.depth)},${A.Y(r[z].dec)}`).join("");
    s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2"/>`;
    for(const r of sw)s+=`<circle cx="${A.X(r.depth)}" cy="${A.Y(r[z].dec)}" r="4" fill="${col}" stroke="var(--card)" stroke-width="2"><title>${esc(t(k))}, ${D(r.depth)} m: ${f1(r[z].dec)} h</title></circle>`;
    const last=sw[sw.length-1];s+=`<text x="${A.X(1.8)+8}" y="${A.Y(last[z].dec)+(z==="F3.YW"?10:-2)}" class="ink">${esc(t(k))}</text>`;
  }
  document.getElementById("sweep").innerHTML=s+"</svg>";
  document.getElementById("rf-legend").innerHTML=series.map(([z,k,col])=>`<span><i style="background:${col}"></i>${esc(t(k))}</span>`).join("");
  const tb=`<table><thead><tr><th class="n">${t("thDepth")}</th>${series.map(([z,k])=>`<th class="n">${esc(t(k))}, ${t("thDec")}</th><th class="n">${t("thSky")}</th>`).join("")}</tr></thead><tbody>${sw.map(r=>`<tr><td class="n">${D(r.depth.toFixed(1))}</td>${series.map(([z])=>`<td class="n">${f1(r[z].dec)}</td><td class="n">${f1(r[z].sky)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  document.getElementById("sweeptable").innerHTML=tb;
}
function renderMethod(){
  const b=DATA.bands,c=DATA.counts;
  const o={res:f1(DATA.residual),bA:D(b.A.join("–")),bC:D(b.C.join("–")),bD:D(b.D.join("–")),bB:D(b.B.join("–")),comb:D(c.combinations),feas:D(c.allocations),wb:D(c.with_balconies),sec:f1(DATA.seconds.total)};
  document.getElementById("method").innerHTML=I18N.method.map(p=>`<li>${fmt(p[LANG==="fa"?1:0],o)}</li>`).join("");
  document.getElementById("built").innerHTML=fmt(t("built"),{d:D(DATA.built),c:esc(DATA.commit||"?"),u:DATA.uncommitted?t("uncommitted"):""});
}
function render(){applyStatic();renderFindings();renderPre();renderZones();renderCards();renderScatter();renderPickTable();renderSweep();renderMethod();}
function setLang(l){LANG=l;try{localStorage.setItem(LANG_KEY,l);}catch(e){}render();}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{if(b.dataset.lang!==LANG)setLang(b.dataset.lang);});
document.querySelectorAll("[data-theme-set]").forEach(b=>b.onclick=()=>setTheme(b.dataset.themeSet));
setTheme(themeNow());
render();
</script>
</body>
